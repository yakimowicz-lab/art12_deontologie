<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cas pratique – Code de déontologie immobilier</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #f5f4f0;
  color: #1a1a18;
  min-height: 100vh;
  padding: 2rem 1rem;
}
.wrap { max-width: 680px; margin: 0 auto; }
h1 {
  font-size: 20px;
  font-weight: 500;
  color: #01438F;
  margin-bottom: 0.25rem;
}
.subtitle {
  font-size: 14px;
  color: #666;
  margin-bottom: 1.5rem;
}
.progress-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
.progress-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #d0cec8;
  transition: background 0.2s;
}
.progress-dot.done { background: #52AE32; }
.progress-dot.active { background: #01438F; }
.scenario-card {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
}
.scenario-badge {
  display: inline-block;
  background: #EAF3DE;
  color: #27500A;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 1rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.avatar-row { display: flex; gap: 12px; align-items: center; margin-bottom: 1rem; }
.avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  flex-shrink: 0;
}
.avatar.agent { background: #EAF3DE; color: #27500A; }
.avatar.client { background: #E6F1FB; color: #0C447C; }
.avatar.syndicat { background: #EEEDFE; color: #3C3489; }
.avatar.marchand { background: #FAEEDA; color: #633806; }
.avatar-name { font-size: 14px; font-weight: 600; color: #1a1a18; }
.avatar-desc { font-size: 12px; color: #888; }
.scene-text { font-size: 15px; line-height: 1.7; color: #2c2c2a; }
.question-section { margin-bottom: 1.25rem; }
.question-label {
  font-size: 11px; font-weight: 600; color: #888;
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 0.75rem;
}
.question-text {
  font-size: 15px; font-weight: 600; color: #1a1a18;
  line-height: 1.6; margin-bottom: 1rem;
}
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.85rem 1rem;
  font-size: 14px;
  color: #1a1a18;
  text-align: left;
  cursor: pointer;
  line-height: 1.55;
  transition: background 0.12s, border-color 0.12s;
}
.choice-btn:hover { background: #f5f4f0; border-color: #a0a099; }
.choice-btn.correct { background: #EAF3DE; border-color: #52AE32; color: #173404; }
.choice-btn.wrong { background: #FCEBEB; border-color: #E24B4A; color: #501313; }
.choice-btn:disabled { pointer-events: none; opacity: 0.5; }
.feedback {
  display: none;
  border-left: 3px solid #52AE32;
  background: #f5f4f0;
  border-radius: 0 8px 8px 0;
  padding: 1rem 1.1rem;
  margin-top: 1rem;
  font-size: 14px;
  line-height: 1.65;
  color: #2c2c2a;
}
.feedback.show { display: block; }
.feedback.wrong-fb { border-left-color: #E24B4A; }
.feedback strong { font-weight: 600; }
.ref {
  font-size: 12px; color: #888;
  margin-top: 0.5rem; font-style: italic;
}
.nav-row {
  display: flex; justify-content: space-between;
  align-items: center; margin-top: 1.25rem;
}
.q-counter { font-size: 13px; color: #888; }
.next-btn {
  display: none;
  background: #01438F;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 0.6rem 1.25rem;
  font-size: 14px;
  cursor: pointer;
  font-weight: 500;
}
.next-btn.show { display: block; }
.next-btn:hover { background: #143466; }
.score-card {
  display: none;
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 2.5rem 2rem;
  text-align: center;
}
.score-card.show { display: block; }
.score-big { font-size: 56px; font-weight: 700; color: #01438F; margin: 0.5rem 0; }
.score-sub { font-size: 15px; color: #555; margin-bottom: 1.75rem; line-height: 1.6; }
.restart-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.65rem 1.5rem;
  font-size: 14px;
  color: #1a1a18;
  cursor: pointer;
  font-weight: 500;
}
.restart-btn:hover { background: #f5f4f0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Code de déontologie — Article 2 : les principes fondamentaux</h1>
  <p class="subtitle">3 scénarios pour identifier les manquements aux devoirs de conscience, dignité, loyauté, sincérité et probité</p>

  <div class="progress-row" id="progress-row"></div>

  <div id="quiz-area">
    <div class="scenario-card" id="scene-card"></div>
    <div class="scenario-card" id="question-card">
      <div class="question-section">
        <div class="question-label">À vous de jouer</div>
        <div class="question-text" id="q-text"></div>
        <div class="choices" id="choices"></div>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="nav-row">
        <span class="q-counter" id="q-counter"></span>
        <button class="next-btn" id="next-btn">Scénario suivant →</button>
      </div>
    </div>
  </div>

  <div class="score-card" id="score-card">
    <div class="question-label">Votre résultat</div>
    <div class="score-big" id="score-val">0/4</div>
    <div class="score-sub" id="score-msg"></div>
    <button class="restart-btn" onclick="restart()">↺ Recommencer</button>
  </div>
</div>

<script>
const scenarios = [
  {
    badge: "Scénario 1 — Sincérité et loyauté",
    avatarClass: "agent",
    avatarInitials: "KD",
    avatarName: "Karim Djebali",
    avatarDesc: "Négociateur immobilier, agence indépendante",
    scene: "Karim visite un appartement avec un acquéreur potentiel. Il sait que la toiture de l'immeuble nécessite des travaux importants votés en AG, représentant une quote-part de 4 200 € pour ce lot. Il préfère ne pas en parler pour ne pas « bloquer » la vente, en se disant que l'acquéreur pourra le découvrir lui-même lors de la signature chez le notaire.",
    question: "Le comportement de Karim est-il conforme à l'article 2 du code de déontologie ?",
    choices: [
      { text: "Oui, il n'a pas menti : il n'a simplement pas mentionné cette information.", correct: false },
      { text: "Oui, c'est au notaire d'informer l'acquéreur sur les charges de copropriété.", correct: false },
      { text: "Non, une omission volontaire d'information susceptible de nuire à l'acquéreur constitue un manquement aux devoirs de sincérité et de loyauté.", correct: true },
      { text: "Non, mais seulement si l'acquéreur le lui avait expressément demandé.", correct: false }
    ],
    feedbackOk: "Exactement. L'article 2 vise expressément les omissions : « tout comportement, action ou omission susceptible de porter préjudice » est interdit. Taire une information financière majeure est un manquement à la sincérité et à la loyauté, indépendamment de tout mensonge actif.",
    feedbackKo: "Attention : l'article 2 couvre explicitement les omissions, pas seulement les actes. Ne pas mentionner une charge de copropriété votée et connue, dans l'intention de ne pas bloquer la vente, constitue un manquement aux devoirs de sincérité et de loyauté."
  },
  {
    badge: "Scénario 2 — Image de la profession",
    avatarClass: "client",
    avatarInitials: "NP",
    avatarName: "Nathalie Perrin",
    avatarDesc: "Agent immobilier, réseau national",
    scene: "Nathalie est en conflit commercial avec une agence concurrente qui lui a « soufflé » un mandat. Sur sa page Facebook professionnelle, elle publie un post virulent qualifiant cette agence de « voleurs de clients » et d'« escrocs », nommément. Le post est partagé plusieurs dizaines de fois dans la ville.",
    question: "Nathalie a-t-elle manqué à ses obligations déontologiques au titre de l'article 2 ?",
    choices: [
      { text: "Non, elle s'exprime sur sa page personnelle — la liberté d'expression s'applique.", correct: false },
      { text: "Non, si ses accusations sont fondées, elle a le droit de les rendre publiques.", correct: false },
      { text: "Oui, ses propos portent atteinte à l'image de la profession dans son ensemble et contreviennent aux devoirs de dignité et de conscience.", correct: true },
      { text: "Oui, mais uniquement parce qu'elle a nommé l'agence concurrente.", correct: false }
    ],
    feedbackOk: "Bien vu ! L'article 2 impose que les professionnels s'attachent, par leurs comportements et leurs propos, à donner la meilleure image de leur profession. Des accusations publiques et virulentes — même sur un réseau social — ternissent l'image collective de la profession, au-delà du litige individuel.",
    feedbackKo: "La liberté d'expression ne dispense pas du respect de la déontologie. L'article 2 impose aux professionnels de s'abstenir de tout propos susceptible de nuire à l'image de la profession dans son ensemble. Ce type de publication, même fondée sur un différend réel, contrevient aux devoirs de dignité."
  },
  {
    badge: "Scénario 3 — Probité et comportement",
    avatarClass: "syndicat",
    avatarInitials: "RL",
    avatarName: "Raphaël Lemonnier",
    avatarDesc: "Administrateur de biens",
    scene: "Raphaël gère une dizaine de biens locatifs pour des propriétaires. Pour accélérer les visites, il utilise parfois les honoraires perçus sur un dossier pour avancer des frais liés à un autre bien, avec l'intention de régulariser en fin de mois. Il ne s'en cache pas auprès de son équipe, pensant que c'est une simple « gestion de trésorerie ».",
    question: "Ce comportement contrevient-il à l'article 2 du code de déontologie ?",
    choices: [
      { text: "Non, tant qu'il régularise avant la fin du mois, il n'y a pas de préjudice réel.", correct: false },
      { text: "Non, la gestion de trésorerie interne est une décision d'entreprise, pas une question déontologique.", correct: false },
      { text: "Oui, mélanger les fonds de clients distincts constitue un manquement grave à la probité, quel que soit le délai de régularisation.", correct: true },
      { text: "Oui, mais seulement si un propriétaire subit une perte financière avérée.", correct: false }
    ],
    feedbackOk: "Parfait. La probité impose une rigueur absolue dans la gestion des fonds de tiers. Utiliser les fonds d'un client — même temporairement — pour couvrir les besoins d'un autre constitue un manquement grave, indépendamment de toute intention frauduleuse ou de tout préjudice final. C'est également une infraction aux règles de maniement des fonds.",
    feedbackKo: "L'intention de régulariser ne suffit pas. La probité exige que les fonds de chaque client soient traités de façon strictement séparée. Tout mélange, même temporaire, constitue un manquement au devoir de probité au sens de l'article 2 — et expose Raphaël à des sanctions disciplinaires et pénales."
  }
];


let current = 0, score = 0, answered = false;

function buildProgress() {
  const row = document.getElementById('progress-row');
  row.innerHTML = '';
  scenarios.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < current ? ' done' : i === current ? ' active' : '');
    row.appendChild(d);
  });
}

function renderScene() {
  const s = scenarios[current];
  document.getElementById('scene-card').innerHTML = `
    <span class="scenario-badge">${s.badge}</span>
    <div class="avatar-row">
      <div class="avatar ${s.avatarClass}">${s.avatarInitials}</div>
      <div>
        <div class="avatar-name">${s.avatarName}</div>
        <div class="avatar-desc">${s.avatarDesc}</div>
      </div>
    </div>
    <p class="scene-text">${s.scene}</p>
  `;
  document.getElementById('q-text').textContent = s.question;
  document.getElementById('q-counter').textContent = `Question ${current + 1} / ${scenarios.length}`;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  s.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => answer(i);
    choicesEl.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('next-btn').className = 'next-btn';
  answered = false;
  buildProgress();
  updateNextBtn();
}

function answer(idx) {
  if (answered) return;
  answered = true;
  const s = scenarios[current];
  const btns = document.querySelectorAll('.choice-btn');
  const isCorrect = s.choices[idx].correct;
  if (isCorrect) score++;

  btns.forEach((btn, i) => {
    if (s.choices[i].correct) btn.classList.add('correct');
    else btn.disabled = true;
  });
  if (!isCorrect) btns[idx].classList.add('wrong');

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show' + (isCorrect ? '' : ' wrong-fb');
  fb.innerHTML = (isCorrect
    ? '<strong>✓ Bonne réponse.</strong> '
    : '<strong>✗ Pas cette fois.</strong> ')
    + (isCorrect ? s.feedbackOk : s.feedbackKo)
    + `<div class="ref">Référence : Code de déontologie des professions immobilières — article 2 (conscience, dignité, loyauté, sincérité, probité)</div>`;

  document.getElementById('next-btn').className = 'next-btn show';
}

document.getElementById('next-btn').onclick = () => {
  current++;
  if (current < scenarios.length) {
    renderScene();
  } else {
    showScore();
  }
};

function updateNextBtn() {
  const btn = document.getElementById('next-btn');
  btn.textContent = current === scenarios.length - 1 ? 'Voir mes résultats →' : 'Scénario suivant →';
}

function showScore() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('progress-row').style.display = 'none';
  const sc = document.getElementById('score-card');
  sc.className = 'score-card show';
  document.getElementById('score-val').textContent = score + ' / ' + scenarios.length;
  const msgs = [
    "Reprenez les cinq principes de l'article 2 : conscience, dignité, loyauté, sincérité, probité.",
    "Une notion à retravailler. Relisez le scénario que vous avez manqué.",
    "Bien ! Deux situations bien maîtrisées sur trois.",
    "Excellent ! Vous maîtrisez parfaitement les principes fondamentaux de l'article 2."
  ];
  document.getElementById('score-msg').textContent = msgs[Math.min(score, 3)];
}

function restart() {
  current = 0; score = 0; answered = false;
  document.getElementById('quiz-area').style.display = '';
  document.getElementById('progress-row').style.display = '';
  document.getElementById('score-card').className = 'score-card';
  renderScene();
}

renderScene();
</script>
</body>
</html>
