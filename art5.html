<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cas pratique – Code de déontologie immobilier</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #f5f4f0;
  color: #1a1a18;
  min-height: 100vh;
  padding: 2rem 1rem;
}
.wrap { max-width: 680px; margin: 0 auto; }
h1 {
  font-size: 20px;
  font-weight: 500;
  color: #01438F;
  margin-bottom: 0.25rem;
}
.subtitle {
  font-size: 14px;
  color: #666;
  margin-bottom: 1.5rem;
}
.progress-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
.progress-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #d0cec8;
  transition: background 0.2s;
}
.progress-dot.done { background: #52AE32; }
.progress-dot.active { background: #01438F; }
.scenario-card {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
}
.scenario-badge {
  display: inline-block;
  background: #EAF3DE;
  color: #27500A;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 1rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.avatar-row { display: flex; gap: 12px; align-items: center; margin-bottom: 1rem; }
.avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  flex-shrink: 0;
}
.avatar.agent { background: #EAF3DE; color: #27500A; }
.avatar.client { background: #E6F1FB; color: #0C447C; }
.avatar.syndicat { background: #EEEDFE; color: #3C3489; }
.avatar.marchand { background: #FAEEDA; color: #633806; }
.avatar-name { font-size: 14px; font-weight: 600; color: #1a1a18; }
.avatar-desc { font-size: 12px; color: #888; }
.scene-text { font-size: 15px; line-height: 1.7; color: #2c2c2a; }
.question-section { margin-bottom: 1.25rem; }
.question-label {
  font-size: 11px; font-weight: 600; color: #888;
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 0.75rem;
}
.question-text {
  font-size: 15px; font-weight: 600; color: #1a1a18;
  line-height: 1.6; margin-bottom: 1rem;
}
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.85rem 1rem;
  font-size: 14px;
  color: #1a1a18;
  text-align: left;
  cursor: pointer;
  line-height: 1.55;
  transition: background 0.12s, border-color 0.12s;
}
.choice-btn:hover { background: #f5f4f0; border-color: #a0a099; }
.choice-btn.correct { background: #EAF3DE; border-color: #52AE32; color: #173404; }
.choice-btn.wrong { background: #FCEBEB; border-color: #E24B4A; color: #501313; }
.choice-btn:disabled { pointer-events: none; opacity: 0.5; }
.feedback {
  display: none;
  border-left: 3px solid #52AE32;
  background: #f5f4f0;
  border-radius: 0 8px 8px 0;
  padding: 1rem 1.1rem;
  margin-top: 1rem;
  font-size: 14px;
  line-height: 1.65;
  color: #2c2c2a;
}
.feedback.show { display: block; }
.feedback.wrong-fb { border-left-color: #E24B4A; }
.feedback strong { font-weight: 600; }
.ref {
  font-size: 12px; color: #888;
  margin-top: 0.5rem; font-style: italic;
}
.nav-row {
  display: flex; justify-content: space-between;
  align-items: center; margin-top: 1.25rem;
}
.q-counter { font-size: 13px; color: #888; }
.next-btn {
  display: none;
  background: #01438F;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 0.6rem 1.25rem;
  font-size: 14px;
  cursor: pointer;
  font-weight: 500;
}
.next-btn.show { display: block; }
.next-btn:hover { background: #143466; }
.score-card {
  display: none;
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 2.5rem 2rem;
  text-align: center;
}
.score-card.show { display: block; }
.score-big { font-size: 56px; font-weight: 700; color: #01438F; margin: 0.5rem 0; }
.score-sub { font-size: 15px; color: #555; margin-bottom: 1.75rem; line-height: 1.6; }
.restart-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.65rem 1.5rem;
  font-size: 14px;
  color: #1a1a18;
  cursor: pointer;
  font-weight: 500;
}
.restart-btn:hover { background: #f5f4f0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Code de déontologie — Article 5 : organisation et gestion de l'entreprise</h1>
  <p class="subtitle">3 scénarios pour identifier les manquements aux obligations d'organisation, d'habilitation et de définition des pouvoirs</p>

  <div class="progress-row" id="progress-row"></div>

  <div id="quiz-area">
    <div class="scenario-card" id="scene-card"></div>
    <div class="scenario-card" id="question-card">
      <div class="question-section">
        <div class="question-label">À vous de jouer</div>
        <div class="question-text" id="q-text"></div>
        <div class="choices" id="choices"></div>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="nav-row">
        <span class="q-counter" id="q-counter"></span>
        <button class="next-btn" id="next-btn">Scénario suivant →</button>
      </div>
    </div>
  </div>

  <div class="score-card" id="score-card">
    <div class="question-label">Votre résultat</div>
    <div class="score-big" id="score-val">0/4</div>
    <div class="score-sub" id="score-msg"></div>
    <button class="restart-btn" onclick="restart()">↺ Recommencer</button>
  </div>
</div>

<script>
const scenarios = [
  {
    badge: "Scénario 1 — Habilitation d'un collaborateur",
    avatarClass: "agent",
    avatarInitials: "FB",
    avatarName: "Franck Bouvier",
    avatarDesc: "Dirigeant d'agence, réseau indépendant",
    scene: "Franck vient de recruter Lucas, un jeune diplômé enthousiaste. Pour lui faire confiance rapidement, il le laisse signer des mandats de vente au nom de l'agence dès la première semaine, sans vérifier qu'il remplit les conditions réglementaires d'habilitation. Lucas n'a pas encore de carte ou attestation en cours de validité.",
    question: "Franck respecte-t-il ses obligations au titre de l'article 5 du code de déontologie ?",
    choices: [
      { text: "Oui, le dirigeant peut déléguer librement dès lors qu'il fait confiance à son collaborateur.", correct: false },
      { text: "Oui, c'est Lucas qui est responsable de sa propre habilitation.", correct: false },
      { text: "Non, Franck doit s'assurer que tout collaborateur habilité à s'engager en son nom remplit toutes les conditions réglementaires avant de lui confier cette mission.", correct: true },
      { text: "Non, mais seulement si Lucas signe un mandat qui tourne mal.", correct: false }
    ],
    feedbackOk: "Exact. L'article 5 est clair : lorsqu'un professionnel habilite un collaborateur à négocier, s'entremettre ou s'engager en son nom, il doit au préalable s'assurer que cette personne remplit toutes les conditions exigées par la réglementation. C'est la responsabilité de Franck — pas de Lucas.",
    feedbackKo: "La confiance ne remplace pas la vérification réglementaire. L'article 5 impose au dirigeant de s'assurer, avant toute habilitation, que le collaborateur possède les compétences, qualifications et autorisations nécessaires. En cas de manquement, c'est Franck qui engage sa responsabilité."
  },
  {
    badge: "Scénario 2 — Agent commercial indépendant",
    avatarClass: "marchand",
    avatarInitials: "VC",
    avatarName: "Valérie Courtois",
    avatarDesc: "Dirigeante d'un réseau de mandataires",
    scene: "Valérie anime un réseau de mandataires indépendants. Pour simplifier les démarches, elle leur demande de se déclarer rapidement et de commencer à prospecter sans attendre. Elle ne vérifie pas systématiquement leur inscription au registre spécial des agents commerciaux, ni l'existence d'une assurance responsabilité professionnelle en cours de validité.",
    question: "Valérie manque-t-elle à ses obligations au titre de l'article 5 ?",
    choices: [
      { text: "Non, les agents commerciaux sont indépendants : ils gèrent eux-mêmes leurs obligations administratives.", correct: false },
      { text: "Non, l'inscription au registre des agents commerciaux est une formalité facultative.", correct: false },
      { text: "Oui, pour les agents commerciaux indépendants, le professionnel doit vérifier leur inscription au registre spécial et l'existence d'une assurance RC professionnelle.", correct: true },
      { text: "Oui, mais seulement si les mandataires réalisent des transactions supérieures à 200 000 €.", correct: false }
    ],
    feedbackOk: "Bien joué. L'article 5 prévoit des obligations spécifiques pour les agents commerciaux indépendants : inscription au registre spécial des agents commerciaux ET assurance couvrant la responsabilité professionnelle. Valérie doit vérifier ces deux points avant toute mise en activité.",
    feedbackKo: "L'indépendance des mandataires ne décharge pas le titulaire de carte de ses obligations de contrôle. L'article 5 impose explicitement de vérifier l'inscription au registre spécial des agents commerciaux et l'existence d'une assurance RC pro — deux conditions cumulatives que Valérie ne peut pas ignorer."
  },
  {
    badge: "Scénario 3 — Définition des pouvoirs",
    avatarClass: "syndicat",
    avatarInitials: "EM",
    avatarName: "Éric Masson",
    avatarDesc: "Titulaire de carte T, deux agences",
    scene: "Éric dirige deux agences et a nommé une directrice pour son second établissement. Pour aller vite, il lui a confié les clés et lui a dit oralement qu'elle pouvait « gérer comme elle l'entend ». Aucun document officiel ne précise l'étendue de ses pouvoirs : ce qu'elle peut signer, engager ou décider de façon autonome.",
    question: "L'organisation mise en place par Éric est-elle conforme à l'article 5 du code de déontologie ?",
    choices: [
      { text: "Oui, une délégation orale entre professionnels est suffisante si les deux parties sont d'accord.", correct: false },
      { text: "Oui, la directrice étant nommée, elle dispose de facto de tous les pouvoirs nécessaires.", correct: false },
      { text: "Non, les pouvoirs confiés à un directeur d'établissement doivent être clairement définis et mentionnés dans les documents officiels.", correct: true },
      { text: "Non, mais uniquement si la directrice commet une erreur engageant la responsabilité de l'agence.", correct: false }
    ],
    feedbackOk: "Parfait. L'article 5 exige que les pouvoirs confiés aux collaborateurs et directeurs d'établissement soient clairement définis et formalisés dans les documents officiels. Une délégation orale et vague ne suffit pas — elle expose Éric à des situations ambiguës et à des risques juridiques.",
    feedbackKo: "Une nomination sans formalisation des pouvoirs ne suffit pas. L'article 5 impose que l'étendue des responsabilités soit clairement mentionnée dans les documents officiels. Sans cela, ni la directrice ni les tiers ne savent précisément ce qu'elle peut ou ne peut pas engager — ce qui fragilise toute l'organisation."
  }
];


let current = 0, score = 0, answered = false;

function buildProgress() {
  const row = document.getElementById('progress-row');
  row.innerHTML = '';
  scenarios.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < current ? ' done' : i === current ? ' active' : '');
    row.appendChild(d);
  });
}

function renderScene() {
  const s = scenarios[current];
  document.getElementById('scene-card').innerHTML = `
    <span class="scenario-badge">${s.badge}</span>
    <div class="avatar-row">
      <div class="avatar ${s.avatarClass}">${s.avatarInitials}</div>
      <div>
        <div class="avatar-name">${s.avatarName}</div>
        <div class="avatar-desc">${s.avatarDesc}</div>
      </div>
    </div>
    <p class="scene-text">${s.scene}</p>
  `;
  document.getElementById('q-text').textContent = s.question;
  document.getElementById('q-counter').textContent = `Question ${current + 1} / ${scenarios.length}`;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  s.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => answer(i);
    choicesEl.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('next-btn').className = 'next-btn';
  answered = false;
  buildProgress();
  updateNextBtn();
}

function answer(idx) {
  if (answered) return;
  answered = true;
  const s = scenarios[current];
  const btns = document.querySelectorAll('.choice-btn');
  const isCorrect = s.choices[idx].correct;
  if (isCorrect) score++;

  btns.forEach((btn, i) => {
    if (s.choices[i].correct) btn.classList.add('correct');
    else btn.disabled = true;
  });
  if (!isCorrect) btns[idx].classList.add('wrong');

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show' + (isCorrect ? '' : ' wrong-fb');
  fb.innerHTML = (isCorrect
    ? '<strong>✓ Bonne réponse.</strong> '
    : '<strong>✗ Pas cette fois.</strong> ')
    + (isCorrect ? s.feedbackOk : s.feedbackKo)
    + `<div class="ref">Référence : Code de déontologie des professions immobilières — article 5 (organisation de l'entreprise, habilitation des collaborateurs, agents commerciaux, définition des pouvoirs)</div>`;

  document.getElementById('next-btn').className = 'next-btn show';
}

document.getElementById('next-btn').onclick = () => {
  current++;
  if (current < scenarios.length) {
    renderScene();
  } else {
    showScore();
  }
};

function updateNextBtn() {
  const btn = document.getElementById('next-btn');
  btn.textContent = current === scenarios.length - 1 ? 'Voir mes résultats →' : 'Scénario suivant →';
}

function showScore() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('progress-row').style.display = 'none';
  const sc = document.getElementById('score-card');
  sc.className = 'score-card show';
  document.getElementById('score-val').textContent = score + ' / ' + scenarios.length;
  const msgs = [
    "Reprenez les obligations de l'article 5 : habilitation des collaborateurs, conditions des agents commerciaux, définition formelle des pouvoirs.",
    "Une notion à retravailler. Relisez le scénario que vous avez manqué.",
    "Bien ! Deux situations bien maîtrisées sur trois.",
    "Excellent ! Vous maîtrisez parfaitement les obligations d'organisation et de gestion de l'article 5."
  ];
  document.getElementById('score-msg').textContent = msgs[Math.min(score, 3)];
}

function restart() {
  current = 0; score = 0; answered = false;
  document.getElementById('quiz-area').style.display = '';
  document.getElementById('progress-row').style.display = '';
  document.getElementById('score-card').className = 'score-card';
  renderScene();
}

renderScene();
</script>
</body>
</html>
