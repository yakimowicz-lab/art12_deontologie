<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cas pratique – Code de déontologie immobilier</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #f5f4f0;
  color: #1a1a18;
  min-height: 100vh;
  padding: 2rem 1rem;
}
.wrap { max-width: 680px; margin: 0 auto; }
h1 {
  font-size: 20px;
  font-weight: 500;
  color: #01438F;
  margin-bottom: 0.25rem;
}
.subtitle {
  font-size: 14px;
  color: #666;
  margin-bottom: 1.5rem;
}
.progress-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
.progress-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #d0cec8;
  transition: background 0.2s;
}
.progress-dot.done { background: #52AE32; }
.progress-dot.active { background: #01438F; }
.scenario-card {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
}
.scenario-badge {
  display: inline-block;
  background: #EAF3DE;
  color: #27500A;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 1rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.avatar-row { display: flex; gap: 12px; align-items: center; margin-bottom: 1rem; }
.avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  flex-shrink: 0;
}
.avatar.agent { background: #EAF3DE; color: #27500A; }
.avatar.client { background: #E6F1FB; color: #0C447C; }
.avatar.syndicat { background: #EEEDFE; color: #3C3489; }
.avatar.marchand { background: #FAEEDA; color: #633806; }
.avatar-name { font-size: 14px; font-weight: 600; color: #1a1a18; }
.avatar-desc { font-size: 12px; color: #888; }
.scene-text { font-size: 15px; line-height: 1.7; color: #2c2c2a; }
.question-section { margin-bottom: 1.25rem; }
.question-label {
  font-size: 11px; font-weight: 600; color: #888;
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 0.75rem;
}
.question-text {
  font-size: 15px; font-weight: 600; color: #1a1a18;
  line-height: 1.6; margin-bottom: 1rem;
}
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.85rem 1rem;
  font-size: 14px;
  color: #1a1a18;
  text-align: left;
  cursor: pointer;
  line-height: 1.55;
  transition: background 0.12s, border-color 0.12s;
}
.choice-btn:hover { background: #f5f4f0; border-color: #a0a099; }
.choice-btn.correct { background: #EAF3DE; border-color: #52AE32; color: #173404; }
.choice-btn.wrong { background: #FCEBEB; border-color: #E24B4A; color: #501313; }
.choice-btn:disabled { pointer-events: none; opacity: 0.5; }
.feedback {
  display: none;
  border-left: 3px solid #52AE32;
  background: #f5f4f0;
  border-radius: 0 8px 8px 0;
  padding: 1rem 1.1rem;
  margin-top: 1rem;
  font-size: 14px;
  line-height: 1.65;
  color: #2c2c2a;
}
.feedback.show { display: block; }
.feedback.wrong-fb { border-left-color: #E24B4A; }
.feedback strong { font-weight: 600; }
.ref {
  font-size: 12px; color: #888;
  margin-top: 0.5rem; font-style: italic;
}
.nav-row {
  display: flex; justify-content: space-between;
  align-items: center; margin-top: 1.25rem;
}
.q-counter { font-size: 13px; color: #888; }
.next-btn {
  display: none;
  background: #01438F;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 0.6rem 1.25rem;
  font-size: 14px;
  cursor: pointer;
  font-weight: 500;
}
.next-btn.show { display: block; }
.next-btn:hover { background: #143466; }
.score-card {
  display: none;
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 2.5rem 2rem;
  text-align: center;
}
.score-card.show { display: block; }
.score-big { font-size: 56px; font-weight: 700; color: #01438F; margin: 0.5rem 0; }
.score-sub { font-size: 15px; color: #555; margin-bottom: 1.75rem; line-height: 1.6; }
.restart-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.65rem 1.5rem;
  font-size: 14px;
  color: #1a1a18;
  cursor: pointer;
  font-weight: 500;
}
.restart-btn:hover { background: #f5f4f0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Code de déontologie — Article 3 : le respect de la loi</h1>
  <p class="subtitle">3 scénarios pour identifier les manquements aux obligations légales et réglementaires du professionnel de l'immobilier</p>

  <div class="progress-row" id="progress-row"></div>

  <div id="quiz-area">
    <div class="scenario-card" id="scene-card"></div>
    <div class="scenario-card" id="question-card">
      <div class="question-section">
        <div class="question-label">À vous de jouer</div>
        <div class="question-text" id="q-text"></div>
        <div class="choices" id="choices"></div>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="nav-row">
        <span class="q-counter" id="q-counter"></span>
        <button class="next-btn" id="next-btn">Scénario suivant →</button>
      </div>
    </div>
  </div>

  <div class="score-card" id="score-card">
    <div class="question-label">Votre résultat</div>
    <div class="score-big" id="score-val">0/4</div>
    <div class="score-sub" id="score-msg"></div>
    <button class="restart-btn" onclick="restart()">↺ Recommencer</button>
  </div>
</div>

<script>
const scenarios = [
  {
    badge: "Scénario 1 — Discrimination",
    avatarClass: "agent",
    avatarInitials: "CW",
    avatarName: "Céline Wantz",
    avatarDesc: "Négociatrice en location, agence urbaine",
    scene: "Un propriétaire confie à Céline la gestion locative de son appartement. Il lui précise oralement qu'il ne souhaite « pas louer à des familles étrangères » et lui demande de filtrer les dossiers en conséquence. Céline, qui veut conserver ce mandat, applique la consigne sans la formaliser par écrit.",
    question: "Céline manque-t-elle à ses obligations au titre de l'article 3 du code de déontologie ?",
    choices: [
      { text: "Non, elle applique les instructions de son mandant, ce qui la dégage de toute responsabilité.", correct: false },
      { text: "Non, tant qu'elle ne met rien par écrit, il n'y a pas de preuve de discrimination.", correct: false },
      { text: "Oui, appliquer un critère discriminatoire défini par le Code pénal est interdit, même sur instruction du mandant.", correct: true },
      { text: "Oui, mais seulement si le propriétaire a formulé la demande par écrit.", correct: false }
    ],
    feedbackOk: "Exact. L'article 3 interdit toute discrimination envers une personne physique ou morale lors de l'exercice de l'activité professionnelle. Les critères discriminatoires du Code pénal s'imposent au professionnel — indépendamment des instructions du mandant. Céline aurait dû refuser.",
    feedbackKo: "Les instructions du mandant ne peuvent pas exonérer un professionnel de ses obligations légales. L'article 3 interdit toute pratique discriminatoire — y compris lorsqu'elle est appliquée oralement. Céline est personnellement responsable des critères qu'elle met en œuvre."
  },
  {
    badge: "Scénario 2 — LCB-FT",
    avatarClass: "marchand",
    avatarInitials: "JB",
    avatarName: "Julien Bastien",
    avatarDesc: "Agent immobilier, transactions résidentielles haut de gamme",
    scene: "Julien accompagne l'achat d'un bien à 980 000 € par un acquéreur qui règle l'intégralité en cash, via plusieurs virements depuis des comptes domiciliés dans différents pays. L'acquéreur explique que c'est « pour des raisons fiscales ». Julien, pressé de conclure, ne réalise aucune vérification supplémentaire et ne remplit aucune déclaration.",
    question: "Julien a-t-il respecté ses obligations au regard de l'article 3 du code de déontologie ?",
    choices: [
      { text: "Oui, il n'a pas à se substituer aux services fiscaux ou bancaires pour contrôler l'origine des fonds.", correct: false },
      { text: "Oui, tant que la vente est légalement conclue chez le notaire, le professionnel n'a pas d'obligation supplémentaire.", correct: false },
      { text: "Non, les signaux d'alerte LCB-FT l'obligeaient à analyser l'opération et, si nécessaire, à effectuer une déclaration de soupçon à TRACFIN.", correct: true },
      { text: "Non, mais seulement parce que le montant dépasse 500 000 €.", correct: false }
    ],
    feedbackOk: "Bien joué. L'article 3 impose au professionnel de respecter les règles LCB-FT : vérification d'identité, analyse des opérations à risque, et déclaration de soupçon à TRACFIN si nécessaire. Plusieurs virements depuis des comptes étrangers, sur un bien de grande valeur, constituent des signaux d'alerte que Julien ne pouvait pas ignorer.",
    feedbackKo: "L'agent immobilier est un assujetti au dispositif LCB-FT. L'article 3 lui impose d'analyser les opérations présentant un risque et de déclarer à TRACFIN tout soupçon de blanchiment — indépendamment du rôle du notaire ou du montant exact. Plusieurs virements depuis des comptes étrangers sont des signaux d'alerte manifestes."
  },
  {
    badge: "Scénario 3 — Refus d'un acte frauduleux",
    avatarClass: "syndicat",
    avatarInitials: "MF",
    avatarName: "Margaux Ferrand",
    avatarDesc: "Syndic de copropriété",
    scene: "Un président de conseil syndical demande à Margaux de régulariser rétroactivement des procès-verbaux d'assemblées générales qui n'ont jamais eu lieu, afin de justifier des dépenses déjà engagées sans vote. Il lui assure que « tout le monde est d'accord » et que c'est « juste une formalité ».",
    question: "Quelle est l'obligation de Margaux au regard de l'article 3 du code de déontologie ?",
    choices: [
      { text: "Elle peut s'exécuter si tous les copropriétaires donnent leur accord écrit.", correct: false },
      { text: "Elle doit refuser, car rédiger de faux procès-verbaux constitue un acte qu'elle sait illégal et frauduleux.", correct: true },
      { text: "Elle peut s'exécuter, car c'est le président du conseil syndical qui en prend la responsabilité.", correct: false },
      { text: "Elle doit demander l'avis d'un avocat avant de décider.", correct: false }
    ],
    feedbackOk: "Parfait. L'article 3 est explicite : le professionnel ne doit jamais participer, directement ou indirectement, à une opération frauduleuse. S'il est sollicité pour rédiger ou faciliter un acte qu'il sait illégal, il a l'obligation de refuser — quelle que soit la pression exercée par le donneur d'ordre.",
    feedbackKo: "L'accord des copropriétaires ou la responsabilité assumée par le président du conseil syndical ne dégagent pas Margaux de ses propres obligations. L'article 3 lui impose de refuser toute participation à un acte frauduleux — la fabrication de faux procès-verbaux en fait partie, sans ambiguïté."
  }
];


let current = 0, score = 0, answered = false;

function buildProgress() {
  const row = document.getElementById('progress-row');
  row.innerHTML = '';
  scenarios.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < current ? ' done' : i === current ? ' active' : '');
    row.appendChild(d);
  });
}

function renderScene() {
  const s = scenarios[current];
  document.getElementById('scene-card').innerHTML = `
    <span class="scenario-badge">${s.badge}</span>
    <div class="avatar-row">
      <div class="avatar ${s.avatarClass}">${s.avatarInitials}</div>
      <div>
        <div class="avatar-name">${s.avatarName}</div>
        <div class="avatar-desc">${s.avatarDesc}</div>
      </div>
    </div>
    <p class="scene-text">${s.scene}</p>
  `;
  document.getElementById('q-text').textContent = s.question;
  document.getElementById('q-counter').textContent = `Question ${current + 1} / ${scenarios.length}`;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  s.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => answer(i);
    choicesEl.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('next-btn').className = 'next-btn';
  answered = false;
  buildProgress();
  updateNextBtn();
}

function answer(idx) {
  if (answered) return;
  answered = true;
  const s = scenarios[current];
  const btns = document.querySelectorAll('.choice-btn');
  const isCorrect = s.choices[idx].correct;
  if (isCorrect) score++;

  btns.forEach((btn, i) => {
    if (s.choices[i].correct) btn.classList.add('correct');
    else btn.disabled = true;
  });
  if (!isCorrect) btns[idx].classList.add('wrong');

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show' + (isCorrect ? '' : ' wrong-fb');
  fb.innerHTML = (isCorrect
    ? '<strong>✓ Bonne réponse.</strong> '
    : '<strong>✗ Pas cette fois.</strong> ')
    + (isCorrect ? s.feedbackOk : s.feedbackKo)
    + `<div class="ref">Référence : Code de déontologie des professions immobilières — article 3 (respect des lois et réglementations : non-discrimination, LCB-FT, données personnelles, refus d'actes frauduleux)</div>`;

  document.getElementById('next-btn').className = 'next-btn show';
}

document.getElementById('next-btn').onclick = () => {
  current++;
  if (current < scenarios.length) {
    renderScene();
  } else {
    showScore();
  }
};

function updateNextBtn() {
  const btn = document.getElementById('next-btn');
  btn.textContent = current === scenarios.length - 1 ? 'Voir mes résultats →' : 'Scénario suivant →';
}

function showScore() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('progress-row').style.display = 'none';
  const sc = document.getElementById('score-card');
  sc.className = 'score-card show';
  document.getElementById('score-val').textContent = score + ' / ' + scenarios.length;
  const msgs = [
    "Reprenez les quatre obligations de l'article 3 : non-discrimination, LCB-FT, protection des données, refus d'actes frauduleux.",
    "Une notion à retravailler. Relisez le scénario que vous avez manqué.",
    "Bien ! Deux situations bien maîtrisées sur trois.",
    "Excellent ! Vous maîtrisez parfaitement les obligations légales et réglementaires de l'article 3."
  ];
  document.getElementById('score-msg').textContent = msgs[Math.min(score, 3)];
}

function restart() {
  current = 0; score = 0; answered = false;
  document.getElementById('quiz-area').style.display = '';
  document.getElementById('progress-row').style.display = '';
  document.getElementById('score-card').className = 'score-card';
  renderScene();
}

renderScene();
</script>
</body>
</html>
