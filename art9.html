<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cas pratique – Code de déontologie immobilier</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #f5f4f0;
  color: #1a1a18;
  min-height: 100vh;
  padding: 2rem 1rem;
}
.wrap { max-width: 680px; margin: 0 auto; }
h1 {
  font-size: 20px;
  font-weight: 500;
  color: #01438F;
  margin-bottom: 0.25rem;
}
.subtitle {
  font-size: 14px;
  color: #666;
  margin-bottom: 1.5rem;
}
.progress-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
.progress-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #d0cec8;
  transition: background 0.2s;
}
.progress-dot.done { background: #52AE32; }
.progress-dot.active { background: #01438F; }
.scenario-card {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
}
.scenario-badge {
  display: inline-block;
  background: #EAF3DE;
  color: #27500A;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 1rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.avatar-row { display: flex; gap: 12px; align-items: center; margin-bottom: 1rem; }
.avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  flex-shrink: 0;
}
.avatar.agent { background: #EAF3DE; color: #27500A; }
.avatar.client { background: #E6F1FB; color: #0C447C; }
.avatar.syndicat { background: #EEEDFE; color: #3C3489; }
.avatar.marchand { background: #FAEEDA; color: #633806; }
.avatar-name { font-size: 14px; font-weight: 600; color: #1a1a18; }
.avatar-desc { font-size: 12px; color: #888; }
.scene-text { font-size: 15px; line-height: 1.7; color: #2c2c2a; }
.question-section { margin-bottom: 1.25rem; }
.question-label {
  font-size: 11px; font-weight: 600; color: #888;
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 0.75rem;
}
.question-text {
  font-size: 15px; font-weight: 600; color: #1a1a18;
  line-height: 1.6; margin-bottom: 1rem;
}
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.85rem 1rem;
  font-size: 14px;
  color: #1a1a18;
  text-align: left;
  cursor: pointer;
  line-height: 1.55;
  transition: background 0.12s, border-color 0.12s;
}
.choice-btn:hover { background: #f5f4f0; border-color: #a0a099; }
.choice-btn.correct { background: #EAF3DE; border-color: #52AE32; color: #173404; }
.choice-btn.wrong { background: #FCEBEB; border-color: #E24B4A; color: #501313; }
.choice-btn:disabled { pointer-events: none; opacity: 0.5; }
.feedback {
  display: none;
  border-left: 3px solid #52AE32;
  background: #f5f4f0;
  border-radius: 0 8px 8px 0;
  padding: 1rem 1.1rem;
  margin-top: 1rem;
  font-size: 14px;
  line-height: 1.65;
  color: #2c2c2a;
}
.feedback.show { display: block; }
.feedback.wrong-fb { border-left-color: #E24B4A; }
.feedback strong { font-weight: 600; }
.ref {
  font-size: 12px; color: #888;
  margin-top: 0.5rem; font-style: italic;
}
.nav-row {
  display: flex; justify-content: space-between;
  align-items: center; margin-top: 1.25rem;
}
.q-counter { font-size: 13px; color: #888; }
.next-btn {
  display: none;
  background: #01438F;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 0.6rem 1.25rem;
  font-size: 14px;
  cursor: pointer;
  font-weight: 500;
}
.next-btn.show { display: block; }
.next-btn:hover { background: #143466; }
.score-card {
  display: none;
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 2.5rem 2rem;
  text-align: center;
}
.score-card.show { display: block; }
.score-big { font-size: 56px; font-weight: 700; color: #01438F; margin: 0.5rem 0; }
.score-sub { font-size: 15px; color: #555; margin-bottom: 1.75rem; line-height: 1.6; }
.restart-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.65rem 1.5rem;
  font-size: 14px;
  color: #1a1a18;
  cursor: pointer;
  font-weight: 500;
}
.restart-btn:hover { background: #f5f4f0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Code de déontologie — Article 9 : prévention des conflits d'intérêts</h1>
  <p class="subtitle">3 scénarios pour identifier les situations de conflit d'intérêts et les obligations de déclaration</p>

  <div class="progress-row" id="progress-row"></div>

  <div id="quiz-area">
    <div class="scenario-card" id="scene-card"></div>
    <div class="scenario-card" id="question-card">
      <div class="question-section">
        <div class="question-label">À vous de jouer</div>
        <div class="question-text" id="q-text"></div>
        <div class="choices" id="choices"></div>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="nav-row">
        <span class="q-counter" id="q-counter"></span>
        <button class="next-btn" id="next-btn">Scénario suivant →</button>
      </div>
    </div>
  </div>

  <div class="score-card" id="score-card">
    <div class="question-label">Votre résultat</div>
    <div class="score-big" id="score-val">0/4</div>
    <div class="score-sub" id="score-msg"></div>
    <button class="restart-btn" onclick="restart()">↺ Recommencer</button>
  </div>
</div>

<script>
const scenarios = [
  {
    badge: "Scénario 1 — Achat d'un bien en mandat",
    avatarClass: "agent",
    avatarInitials: "JM",
    avatarName: "Julien Marceau",
    avatarDesc: "Agent immobilier, transactions résidentielles",
    scene: "Julien a reçu un mandat de vente pour une maison estimée à 320 000 €. Il pense que le bien est sous-évalué et représente une belle opportunité. Sans en informer le vendeur, il demande à sa sœur de déposer une offre d'achat au prix. Il se dit qu'il ne fait rien d'illégal puisque c'est elle qui achète — et non lui directement.",
    question: "Julien respecte-t-il ses obligations au titre de l'article 9 du code de déontologie ?",
    choices: [
      { text: "Oui, c'est sa sœur qui achète — Julien n'est pas personnellement acquéreur du bien.", correct: false },
      { text: "Oui, tant que l'offre est au prix du mandat, il n'y a pas de préjudice pour le vendeur.", correct: false },
      { text: "Non, un professionnel ne peut pas acquérir, même par l'intermédiaire d'un proche, un bien pour lequel il détient un mandat, sans en avoir informé préalablement son client.", correct: true },
      { text: "Non, mais seulement si Julien perçoit personnellement un avantage financier de la transaction.", correct: false }
    ],
    feedbackOk: "Exact. L'article 9 est explicite : le professionnel ne peut pas acquérir un bien en mandat, directement ou par l'intermédiaire d'un proche ou d'une société dans laquelle il détient des intérêts, sans en avoir informé préalablement son client. L'interposition de la sœur de Julien ne change rien à l'obligation de transparence.",
    feedbackKo: "L'intermédiaire ne neutralise pas le conflit d'intérêts. L'article 9 vise expressément les acquisitions réalisées via un proche ou une société liée au professionnel. Julien aurait dû informer le vendeur de cet intérêt avant toute démarche — c'est une condition non négociable."
  },
  {
    badge: "Scénario 2 — Recommandation d'un prestataire lié",
    avatarClass: "syndicat",
    avatarInitials: "SB",
    avatarName: "Sophie Blanchard",
    avatarDesc: "Négociatrice, réseau national",
    scene: "Sophie accompagne un acquéreur et lui recommande chaleureusement un courtier en crédit immobilier partenaire de son réseau. Elle perçoit une commission de recommandation à chaque dossier financé. Elle ne mentionne pas ce partenariat commercial à son client, estimant que « ça ne change rien à la qualité du service ».",
    question: "Sophie manque-t-elle à ses obligations au titre de l'article 9 du code de déontologie ?",
    choices: [
      { text: "Non, recommander un prestataire de qualité fait partie du service rendu au client.", correct: false },
      { text: "Oui, lorsque le professionnel entretient des liens commerciaux avec un organisme dont il recommande les services, il doit en informer son client.", correct: true },
      { text: "Non, la commission de recommandation est une pratique courante et légalement encadrée.", correct: false },
      { text: "Oui, mais seulement si la commission dépasse un certain montant.", correct: false }
    ],
    feedbackOk: "Bien joué. L'article 9 impose au professionnel d'informer son client lorsqu'il entretient des liens commerciaux avec une entreprise ou un organisme financier dont il recommande les services. Sophie aurait dû déclarer ce partenariat et la commission perçue — peu importe la qualité réelle du courtier recommandé.",
    feedbackKo: "La qualité du prestataire ne dispense pas de la déclaration. L'article 9 impose une transparence totale sur les liens commerciaux ou capitalistiques avec les partenaires recommandés. Sophie devait informer son client de l'existence de ce partenariat et de la rémunération qu'elle en tire — c'est le client qui juge si ça change quelque chose."
  },
  {
    badge: "Scénario 3 — Avis de valeur sur un bien convoité",
    avatarClass: "marchand",
    avatarInitials: "NR",
    avatarName: "Nicolas Renaud",
    avatarDesc: "Agent immobilier, estimations et transactions",
    scene: "Un propriétaire demande à Nicolas de réaliser un avis de valeur sur son appartement. Nicolas est lui-même intéressé par ce bien pour un investissement locatif personnel. Il réalise l'estimation sans mentionner cet intérêt, en se disant qu'il restera objectif et que ça ne regarde personne.",
    question: "Nicolas est-il en conformité avec l'article 9 du code de déontologie ?",
    choices: [
      { text: "Oui, un professionnel expérimenté est capable d'objectivité même s'il est personnellement intéressé par le bien.", correct: false },
      { text: "Oui, tant que l'estimation est cohérente avec le marché, l'intérêt personnel de Nicolas ne pose pas de problème.", correct: false },
      { text: "Oui, mais il devra déclarer son intérêt uniquement s'il fait une offre d'achat par la suite.", correct: false },
      { text: "Non, un professionnel ne doit pas réaliser un avis de valeur sur un bien pour lequel il possède ou envisage d'acquérir un intérêt personnel — ou, à défaut, le mentionner explicitement dans l'avis.", correct: true }
    ],
    feedbackOk: "Parfait. L'article 9 interdit de réaliser un avis de valeur sur un bien dans lequel le professionnel possède ou envisage d'acquérir un intérêt personnel. Si une telle situation existe malgré tout, elle doit être explicitement mentionnée dans l'avis. Nicolas aurait dû soit refuser la mission, soit déclarer son intérêt dans le document.",
    feedbackKo: "La conviction d'être objectif ne suffit pas. L'article 9 impose soit de refuser de réaliser un avis de valeur sur un bien pour lequel on a un intérêt personnel, soit de le mentionner explicitement dans le document. C'est au client de juger si cette situation influence ou non la fiabilité de l'estimation — pas au professionnel."
  }
];


let current = 0, score = 0, answered = false;

function buildProgress() {
  const row = document.getElementById('progress-row');
  row.innerHTML = '';
  scenarios.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < current ? ' done' : i === current ? ' active' : '');
    row.appendChild(d);
  });
}

function renderScene() {
  const s = scenarios[current];
  document.getElementById('scene-card').innerHTML = `
    <span class="scenario-badge">${s.badge}</span>
    <div class="avatar-row">
      <div class="avatar ${s.avatarClass}">${s.avatarInitials}</div>
      <div>
        <div class="avatar-name">${s.avatarName}</div>
        <div class="avatar-desc">${s.avatarDesc}</div>
      </div>
    </div>
    <p class="scene-text">${s.scene}</p>
  `;
  document.getElementById('q-text').textContent = s.question;
  document.getElementById('q-counter').textContent = `Question ${current + 1} / ${scenarios.length}`;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  s.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => answer(i);
    choicesEl.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('next-btn').className = 'next-btn';
  answered = false;
  buildProgress();
  updateNextBtn();
}

function answer(idx) {
  if (answered) return;
  answered = true;
  const s = scenarios[current];
  const btns = document.querySelectorAll('.choice-btn');
  const isCorrect = s.choices[idx].correct;
  if (isCorrect) score++;

  btns.forEach((btn, i) => {
    if (s.choices[i].correct) btn.classList.add('correct');
    else btn.disabled = true;
  });
  if (!isCorrect) btns[idx].classList.add('wrong');

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show' + (isCorrect ? '' : ' wrong-fb');
  fb.innerHTML = (isCorrect
    ? '<strong>✓ Bonne réponse.</strong> '
    : '<strong>✗ Pas cette fois.</strong> ')
    + (isCorrect ? s.feedbackOk : s.feedbackKo)
    + `<div class="ref">Référence : Code de déontologie des professions immobilières — article 9 (prévention des conflits d'intérêts : achat d'un bien en mandat, liens commerciaux avec des partenaires, avis de valeur et intérêt personnel)</div>`;

  document.getElementById('next-btn').className = 'next-btn show';
}

document.getElementById('next-btn').onclick = () => {
  current++;
  if (current < scenarios.length) {
    renderScene();
  } else {
    showScore();
  }
};

function updateNextBtn() {
  const btn = document.getElementById('next-btn');
  btn.textContent = current === scenarios.length - 1 ? 'Voir mes résultats →' : 'Scénario suivant →';
}

function showScore() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('progress-row').style.display = 'none';
  const sc = document.getElementById('score-card');
  sc.className = 'score-card show';
  document.getElementById('score-val').textContent = score + ' / ' + scenarios.length;
  const msgs = [
    "Reprenez les obligations de l'article 9 : achat d'un bien en mandat, déclaration des liens commerciaux, avis de valeur et intérêt personnel.",
    "Une notion à retravailler. Relisez le scénario que vous avez manqué.",
    "Bien ! Deux situations bien maîtrisées sur trois.",
    "Excellent ! Vous maîtrisez parfaitement les obligations de prévention des conflits d'intérêts de l'article 9."
  ];
  document.getElementById('score-msg').textContent = msgs[Math.min(score, 3)];
}

function restart() {
  current = 0; score = 0; answered = false;
  document.getElementById('quiz-area').style.display = '';
  document.getElementById('progress-row').style.display = '';
  document.getElementById('score-card').className = 'score-card';
  renderScene();
}

renderScene();
</script>
</body>
</html>
