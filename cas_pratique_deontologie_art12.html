<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cas pratique – Code de déontologie immobilier</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #f5f4f0;
  color: #1a1a18;
  min-height: 100vh;
  padding: 2rem 1rem;
}
.wrap { max-width: 680px; margin: 0 auto; }
h1 {
  font-size: 20px;
  font-weight: 500;
  color: #01438F;
  margin-bottom: 0.25rem;
}
.subtitle {
  font-size: 14px;
  color: #666;
  margin-bottom: 1.5rem;
}
.progress-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
.progress-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #d0cec8;
  transition: background 0.2s;
}
.progress-dot.done { background: #52AE32; }
.progress-dot.active { background: #01438F; }
.scenario-card {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
}
.scenario-badge {
  display: inline-block;
  background: #EAF3DE;
  color: #27500A;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 1rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.avatar-row { display: flex; gap: 12px; align-items: center; margin-bottom: 1rem; }
.avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  flex-shrink: 0;
}
.avatar.agent { background: #EAF3DE; color: #27500A; }
.avatar.client { background: #E6F1FB; color: #0C447C; }
.avatar.syndicat { background: #EEEDFE; color: #3C3489; }
.avatar.marchand { background: #FAEEDA; color: #633806; }
.avatar-name { font-size: 14px; font-weight: 600; color: #1a1a18; }
.avatar-desc { font-size: 12px; color: #888; }
.scene-text { font-size: 15px; line-height: 1.7; color: #2c2c2a; }
.question-section { margin-bottom: 1.25rem; }
.question-label {
  font-size: 11px; font-weight: 600; color: #888;
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 0.75rem;
}
.question-text {
  font-size: 15px; font-weight: 600; color: #1a1a18;
  line-height: 1.6; margin-bottom: 1rem;
}
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.85rem 1rem;
  font-size: 14px;
  color: #1a1a18;
  text-align: left;
  cursor: pointer;
  line-height: 1.55;
  transition: background 0.12s, border-color 0.12s;
}
.choice-btn:hover { background: #f5f4f0; border-color: #a0a099; }
.choice-btn.correct { background: #EAF3DE; border-color: #52AE32; color: #173404; }
.choice-btn.wrong { background: #FCEBEB; border-color: #E24B4A; color: #501313; }
.choice-btn:disabled { pointer-events: none; opacity: 0.5; }
.feedback {
  display: none;
  border-left: 3px solid #52AE32;
  background: #f5f4f0;
  border-radius: 0 8px 8px 0;
  padding: 1rem 1.1rem;
  margin-top: 1rem;
  font-size: 14px;
  line-height: 1.65;
  color: #2c2c2a;
}
.feedback.show { display: block; }
.feedback.wrong-fb { border-left-color: #E24B4A; }
.feedback strong { font-weight: 600; }
.ref {
  font-size: 12px; color: #888;
  margin-top: 0.5rem; font-style: italic;
}
.nav-row {
  display: flex; justify-content: space-between;
  align-items: center; margin-top: 1.25rem;
}
.q-counter { font-size: 13px; color: #888; }
.next-btn {
  display: none;
  background: #01438F;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 0.6rem 1.25rem;
  font-size: 14px;
  cursor: pointer;
  font-weight: 500;
}
.next-btn.show { display: block; }
.next-btn:hover { background: #143466; }
.score-card {
  display: none;
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 2.5rem 2rem;
  text-align: center;
}
.score-card.show { display: block; }
.score-big { font-size: 56px; font-weight: 700; color: #01438F; margin: 0.5rem 0; }
.score-sub { font-size: 15px; color: #555; margin-bottom: 1.75rem; line-height: 1.6; }
.restart-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.65rem 1.5rem;
  font-size: 14px;
  color: #1a1a18;
  cursor: pointer;
  font-weight: 500;
}
.restart-btn:hover { background: #f5f4f0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Code de déontologie — Article 12 : la discipline professionnelle</h1>
  <p class="subtitle">3 scénarios pour identifier les obligations de coopération et de respect des décisions disciplinaires</p>

  <div class="progress-row" id="progress-row"></div>

  <div id="quiz-area">
    <div class="scenario-card" id="scene-card"></div>
    <div class="scenario-card" id="question-card">
      <div class="question-section">
        <div class="question-label">À vous de jouer</div>
        <div class="question-text" id="q-text"></div>
        <div class="choices" id="choices"></div>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="nav-row">
        <span class="q-counter" id="q-counter"></span>
        <button class="next-btn" id="next-btn">Scénario suivant →</button>
      </div>
    </div>
  </div>

  <div class="score-card" id="score-card">
    <div class="question-label">Votre résultat</div>
    <div class="score-big" id="score-val">0/4</div>
    <div class="score-sub" id="score-msg"></div>
    <button class="restart-btn" onclick="restart()">↺ Recommencer</button>
  </div>
</div>

<script>
const scenarios = [
  {
    badge: "Scénario 1 — Déclenchement d'une procédure disciplinaire",
    avatarClass: "agent",
    avatarInitials: "DM",
    avatarName: "David Moreau",
    avatarDesc: "Agent immobilier, transactions et gestion locative",
    scene: "David a fait l'objet de plusieurs réclamations clients non traitées et d'un contrôle révélant des irrégularités dans la tenue de ses mandats. La Commission de contrôle des activités de transaction et de gestion immobilières l'informe de l'ouverture d'une procédure disciplinaire à son encontre. David estime que ces contrôles sont excessifs et que les réclamations sont infondées. Il décide de ne pas transmettre les documents demandés et de ne pas répondre aux convocations.",
    question: "Le comportement de David est-il conforme à l'article 12 du code de déontologie ?",
    choices: [
      { text: "Oui, un professionnel n'est pas tenu de coopérer s'il estime que la procédure est injustifiée.", correct: false },
      { text: "Oui, refuser de transmettre des documents protège ses droits dans le cadre d'une procédure en cours.", correct: false },
      { text: "Oui, la procédure disciplinaire ne concerne que les manquements graves avérés — David peut contester en amont.", correct: false },
      { text: "Non, lorsqu'une procédure disciplinaire est engagée, le professionnel doit coopérer avec les instances compétentes et ne pas perturber le bon déroulement de la procédure.", correct: true }
    ],
    feedbackOk: "Exact. L'article 12 impose au professionnel faisant l'objet d'une procédure disciplinaire de coopérer avec la Commission de contrôle et de ne pas chercher à perturber ou empêcher le bon déroulement de la procédure. Refuser de répondre aux convocations et de transmettre les documents demandés constitue un manquement supplémentaire.",
    feedbackKo: "Contester une procédure ne signifie pas pouvoir l'ignorer. L'article 12 impose une coopération active avec les instances disciplinaires, indépendamment de l'appréciation personnelle du professionnel sur le bien-fondé de la procédure. David pouvait faire valoir ses arguments — mais pas en refusant de participer."
  },
  {
    badge: "Scénario 2 — Négligence grave",
    avatarClass: "syndicat",
    avatarInitials: "LC",
    avatarName: "Laurent Chevalier",
    avatarDesc: "Administrateur de biens, gestion locative",
    scene: "Laurent gère un portefeuille de 80 biens locatifs. Depuis plusieurs mois, il ne répond plus aux sollicitations de certains propriétaires, laisse des baux expirer sans renouvellement et ne réalise aucun suivi des impayés. Un propriétaire porte plainte. La Commission de contrôle ouvre une procédure disciplinaire pour négligence grave. Laurent pense que la Commission ne peut agir que sur des infractions à la loi, pas sur des questions d'organisation interne.",
    question: "Laurent a-t-il une bonne compréhension du champ d'application de l'article 12 ?",
    choices: [
      { text: "Oui, la Commission de contrôle ne peut intervenir que sur des manquements aux textes légaux, pas sur des défauts d'organisation.", correct: false },
      { text: "Oui, une négligence n'est pas une infraction — elle ne peut pas déclencher une procédure disciplinaire.", correct: false },
      { text: "Non, l'article 12 prévoit explicitement qu'une négligence grave dans l'exercice des missions peut aussi déclencher une procédure disciplinaire.", correct: true },
      { text: "Non, mais seulement si le propriétaire a subi un préjudice financier démontrable.", correct: false }
    ],
    feedbackOk: "Bien vu. L'article 12 est clair : la procédure disciplinaire peut intervenir non seulement en cas de manquement à la loi ou au code de déontologie, mais aussi lorsqu'une négligence grave est constatée dans l'exercice des missions. Les défaillances répétées de Laurent entrent pleinement dans ce cadre.",
    feedbackKo: "La négligence grave est expressément visée par l'article 12, au même titre qu'un manquement à la loi ou aux règlements. Laurent ne peut pas se réfugier derrière l'absence d'infraction textuelle : une organisation défaillante et répétée dans la gestion de biens d'autrui est susceptible de déclencher une procédure disciplinaire."
  },
  {
    badge: "Scénario 3 — Respect d'une décision disciplinaire",
    avatarClass: "marchand",
    avatarInitials: "AB",
    avatarName: "Audrey Blanc",
    avatarDesc: "Négociatrice, réseau national",
    scene: "À l'issue d'une procédure disciplinaire, la Commission de contrôle prononce à l'encontre d'Audrey un avertissement assorti d'une obligation de suivre une formation déontologique dans les six mois. Audrey juge la sanction disproportionnée. Elle décide de ne pas suivre la formation et de continuer à exercer comme si de rien n'était, en attendant de voir si des suites sont données.",
    question: "La réaction d'Audrey est-elle conforme à l'article 12 du code de déontologie ?",
    choices: [
      { text: "Oui, une sanction disciplinaire n'a pas de caractère contraignant tant qu'elle n'est pas confirmée par une juridiction.", correct: false },
      { text: "Oui, Audrey peut choisir de ne pas appliquer la décision si elle la conteste.", correct: false },
      { text: "Oui, un avertissement simple n'implique pas d'obligation d'exécution immédiate.", correct: false },
      { text: "Non, l'article 12 impose au professionnel de respecter les décisions de la Commission de contrôle — qu'il les approuve ou non.", correct: true }
    ],
    feedbackOk: "Parfait. L'article 12 impose au professionnel de respecter les décisions prises par la Commission de contrôle et, le cas échéant, par la juridiction administrative compétente. Audrey peut contester la décision par les voies de recours appropriées — mais elle ne peut pas l'ignorer ni refuser de s'y conformer dans l'attente d'un éventuel recours.",
    feedbackKo: "Une décision disciplinaire s'applique dès sa notification. L'article 12 impose de s'y conformer, indépendamment du désaccord personnel. Audrey dispose de voies de recours si elle estime la sanction injuste — mais contester ne la dispense pas d'exécuter la décision en attendant."
  }
];


let current = 0, score = 0, answered = false;

function buildProgress() {
  const row = document.getElementById('progress-row');
  row.innerHTML = '';
  scenarios.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < current ? ' done' : i === current ? ' active' : '');
    row.appendChild(d);
  });
}

function renderScene() {
  const s = scenarios[current];
  document.getElementById('scene-card').innerHTML = `
    <span class="scenario-badge">${s.badge}</span>
    <div class="avatar-row">
      <div class="avatar ${s.avatarClass}">${s.avatarInitials}</div>
      <div>
        <div class="avatar-name">${s.avatarName}</div>
        <div class="avatar-desc">${s.avatarDesc}</div>
      </div>
    </div>
    <p class="scene-text">${s.scene}</p>
  `;
  document.getElementById('q-text').textContent = s.question;
  document.getElementById('q-counter').textContent = `Question ${current + 1} / ${scenarios.length}`;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  s.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => answer(i);
    choicesEl.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('next-btn').className = 'next-btn';
  answered = false;
  buildProgress();
  updateNextBtn();
}

function answer(idx) {
  if (answered) return;
  answered = true;
  const s = scenarios[current];
  const btns = document.querySelectorAll('.choice-btn');
  const isCorrect = s.choices[idx].correct;
  if (isCorrect) score++;

  btns.forEach((btn, i) => {
    if (s.choices[i].correct) btn.classList.add('correct');
    else btn.disabled = true;
  });
  if (!isCorrect) btns[idx].classList.add('wrong');

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show' + (isCorrect ? '' : ' wrong-fb');
  fb.innerHTML = (isCorrect
    ? '<strong>✓ Bonne réponse.</strong> '
    : '<strong>✗ Pas cette fois.</strong> ')
    + (isCorrect ? s.feedbackOk : s.feedbackKo)
    + `<div class="ref">Référence : Code de déontologie des professions immobilières — article 12 (discipline professionnelle : coopération avec la Commission de contrôle, négligence grave, respect des décisions disciplinaires)</div>`;

  document.getElementById('next-btn').className = 'next-btn show';
}

document.getElementById('next-btn').onclick = () => {
  current++;
  if (current < scenarios.length) {
    renderScene();
  } else {
    showScore();
  }
};

function updateNextBtn() {
  const btn = document.getElementById('next-btn');
  btn.textContent = current === scenarios.length - 1 ? 'Voir mes résultats →' : 'Scénario suivant →';
}

function showScore() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('progress-row').style.display = 'none';
  const sc = document.getElementById('score-card');
  sc.className = 'score-card show';
  document.getElementById('score-val').textContent = score + ' / ' + scenarios.length;
  const msgs = [
    "Reprenez les obligations de l'article 12 : coopérer avec la Commission de contrôle, ne pas perturber la procédure, respecter les décisions disciplinaires.",
    "Une notion à retravailler. Relisez le scénario que vous avez manqué.",
    "Bien ! Deux situations bien maîtrisées sur trois.",
    "Excellent ! Vous maîtrisez parfaitement les obligations de discipline professionnelle de l'article 12."
  ];
  document.getElementById('score-msg').textContent = msgs[Math.min(score, 3)];
}

function restart() {
  current = 0; score = 0; answered = false;
  document.getElementById('quiz-area').style.display = '';
  document.getElementById('progress-row').style.display = '';
  document.getElementById('score-card').className = 'score-card';
  renderScene();
}

renderScene();
</script>
</body>
</html>
