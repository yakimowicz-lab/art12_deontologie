<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cas pratique – Code de déontologie immobilier</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #f5f4f0;
  color: #1a1a18;
  min-height: 100vh;
  padding: 2rem 1rem;
}
.wrap { max-width: 680px; margin: 0 auto; }
h1 {
  font-size: 20px;
  font-weight: 500;
  color: #01438F;
  margin-bottom: 0.25rem;
}
.subtitle {
  font-size: 14px;
  color: #666;
  margin-bottom: 1.5rem;
}
.progress-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
.progress-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #d0cec8;
  transition: background 0.2s;
}
.progress-dot.done { background: #52AE32; }
.progress-dot.active { background: #01438F; }
.scenario-card {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
}
.scenario-badge {
  display: inline-block;
  background: #EAF3DE;
  color: #27500A;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 1rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.avatar-row { display: flex; gap: 12px; align-items: center; margin-bottom: 1rem; }
.avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  flex-shrink: 0;
}
.avatar.agent { background: #EAF3DE; color: #27500A; }
.avatar.client { background: #E6F1FB; color: #0C447C; }
.avatar.syndicat { background: #EEEDFE; color: #3C3489; }
.avatar.marchand { background: #FAEEDA; color: #633806; }
.avatar-name { font-size: 14px; font-weight: 600; color: #1a1a18; }
.avatar-desc { font-size: 12px; color: #888; }
.scene-text { font-size: 15px; line-height: 1.7; color: #2c2c2a; }
.question-section { margin-bottom: 1.25rem; }
.question-label {
  font-size: 11px; font-weight: 600; color: #888;
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 0.75rem;
}
.question-text {
  font-size: 15px; font-weight: 600; color: #1a1a18;
  line-height: 1.6; margin-bottom: 1rem;
}
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.85rem 1rem;
  font-size: 14px;
  color: #1a1a18;
  text-align: left;
  cursor: pointer;
  line-height: 1.55;
  transition: background 0.12s, border-color 0.12s;
}
.choice-btn:hover { background: #f5f4f0; border-color: #a0a099; }
.choice-btn.correct { background: #EAF3DE; border-color: #52AE32; color: #173404; }
.choice-btn.wrong { background: #FCEBEB; border-color: #E24B4A; color: #501313; }
.choice-btn:disabled { pointer-events: none; opacity: 0.5; }
.feedback {
  display: none;
  border-left: 3px solid #52AE32;
  background: #f5f4f0;
  border-radius: 0 8px 8px 0;
  padding: 1rem 1.1rem;
  margin-top: 1rem;
  font-size: 14px;
  line-height: 1.65;
  color: #2c2c2a;
}
.feedback.show { display: block; }
.feedback.wrong-fb { border-left-color: #E24B4A; }
.feedback strong { font-weight: 600; }
.ref {
  font-size: 12px; color: #888;
  margin-top: 0.5rem; font-style: italic;
}
.nav-row {
  display: flex; justify-content: space-between;
  align-items: center; margin-top: 1.25rem;
}
.q-counter { font-size: 13px; color: #888; }
.next-btn {
  display: none;
  background: #01438F;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 0.6rem 1.25rem;
  font-size: 14px;
  cursor: pointer;
  font-weight: 500;
}
.next-btn.show { display: block; }
.next-btn:hover { background: #143466; }
.score-card {
  display: none;
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 2.5rem 2rem;
  text-align: center;
}
.score-card.show { display: block; }
.score-big { font-size: 56px; font-weight: 700; color: #01438F; margin: 0.5rem 0; }
.score-sub { font-size: 15px; color: #555; margin-bottom: 1.75rem; line-height: 1.6; }
.restart-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.65rem 1.5rem;
  font-size: 14px;
  color: #1a1a18;
  cursor: pointer;
  font-weight: 500;
}
.restart-btn:hover { background: #f5f4f0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Code de déontologie — Article 11 : règlement des litiges</h1>
  <p class="subtitle">3 scénarios pour identifier les bonnes pratiques face aux réclamations et aux situations de conflit</p>

  <div class="progress-row" id="progress-row"></div>

  <div id="quiz-area">
    <div class="scenario-card" id="scene-card"></div>
    <div class="scenario-card" id="question-card">
      <div class="question-section">
        <div class="question-label">À vous de jouer</div>
        <div class="question-text" id="q-text"></div>
        <div class="choices" id="choices"></div>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="nav-row">
        <span class="q-counter" id="q-counter"></span>
        <button class="next-btn" id="next-btn">Scénario suivant →</button>
      </div>
    </div>
  </div>

  <div class="score-card" id="score-card">
    <div class="question-label">Votre résultat</div>
    <div class="score-big" id="score-val">0/4</div>
    <div class="score-sub" id="score-msg"></div>
    <button class="restart-btn" onclick="restart()">↺ Recommencer</button>
  </div>
</div>

<script>
const scenarios = [
  {
    badge: "Scénario 1 — Réclamation d'un mandant",
    avatarClass: "agent",
    avatarInitials: "VB",
    avatarName: "Vincent Barbier",
    avatarDesc: "Agent immobilier, transactions résidentielles",
    scene: "Un vendeur adresse à Vincent un e-mail de réclamation : il estime que son bien a été insuffisamment diffusé pendant le mandat et que Vincent ne l'a pas tenu informé de l'avancement. Vincent lit le message, juge la critique injuste et décide de ne pas y répondre, estimant que le dossier est clos depuis la fin du mandat.",
    question: "Vincent respecte-t-il ses obligations au titre de l'article 11 du code de déontologie ?",
    choices: [
      { text: "Oui, le mandat étant terminé, Vincent n'a plus d'obligation vis-à-vis de ce client.", correct: false },
      { text: "Oui, une réclamation jugée infondée n'appelle pas nécessairement de réponse formelle.", correct: false },
      { text: "Oui, répondre à une réclamation n'est obligatoire que si elle est formulée par courrier recommandé.", correct: false },
      { text: "Non, toute réclamation doit être traitée de bonne foi et dans un délai raisonnable, quelle que soit l'appréciation personnelle du professionnel sur son bien-fondé.", correct: true }
    ],
    feedbackOk: "Exact. L'article 11 impose de répondre à toute réclamation de bonne foi et dans un délai raisonnable — y compris lorsque le professionnel la juge injuste ou infondée. Ignorer une réclamation, quelle qu'en soit la forme, est un manquement au devoir de professionnalisme.",
    feedbackKo: "La fin du mandat ne met pas fin aux obligations déontologiques. L'article 11 impose de traiter toute réclamation avec sérieux et de bonne foi, dans un délai raisonnable — indépendamment du canal utilisé par le client et de l'appréciation personnelle du professionnel sur son bien-fondé."
  },
  {
    badge: "Scénario 2 — Conflit avec un confrère",
    avatarClass: "marchand",
    avatarInitials: "ER",
    avatarName: "Élise Renaud",
    avatarDesc: "Négociatrice, réseau national",
    scene: "Élise est en désaccord avec un confrère sur le partage des honoraires dans le cadre d'une vente en co-exclusivité. Le confrère lui adresse un message pour tenter de trouver une solution amiable. Élise, convaincue d'être dans son droit, décide de ne pas lui répondre et de saisir directement un avocat sans avoir cherché à dialoguer.",
    question: "La démarche d'Élise est-elle conforme à l'article 11 du code de déontologie ?",
    choices: [
      { text: "Oui, lorsqu'un désaccord porte sur des honoraires, le recours juridique est la voie la plus appropriée.", correct: false },
      { text: "Oui, un professionnel n'est pas tenu de répondre aux sollicitations d'un confrère dans un contexte conflictuel.", correct: false },
      { text: "Non, le code privilégie la recherche d'une solution amiable avant tout recours contentieux — Élise aurait dû répondre au confrère et tenter le dialogue.", correct: true },
      { text: "Non, mais seulement si le montant du litige est inférieur à un certain seuil.", correct: false }
    ],
    feedbackOk: "Bien vu. L'article 11 impose de privilégier la voie amiable face à un désaccord, y compris avec un confrère. Élise aurait dû répondre au message et chercher une issue acceptable avant d'envisager toute démarche contentieuse. Sauter cette étape est un manquement à l'esprit du code.",
    feedbackKo: "La conviction d'être dans son droit ne dispense pas de tenter le dialogue. L'article 11 privilégie explicitement la recherche d'une solution amiable. Élise aurait dû répondre au confrère et explorer une issue négociée avant tout recours juridique — quelle que soit la solidité de sa position."
  },
  {
    badge: "Scénario 3 — Réclamation d'un acquéreur",
    avatarClass: "syndicat",
    avatarInitials: "HD",
    avatarName: "Hélène Dupuis",
    avatarDesc: "Négociatrice, agence indépendante",
    scene: "Un acquéreur contacte Hélène plusieurs semaines après la signature pour se plaindre d'un défaut d'information sur des travaux de ravalement votés en copropriété. Hélène reconnaît en interne avoir eu connaissance de cette information mais ne l'avoir pas transmise. Elle recontacte l'acquéreur rapidement, reconnaît le manquement, s'en excuse et propose une démarche pour trouver une solution.",
    question: "La réaction d'Hélène est-elle conforme à l'article 11 du code de déontologie ?",
    choices: [
      { text: "Oui, répondre rapidement, reconnaître le manquement et proposer une solution amiable est précisément ce que l'article 11 attend d'un professionnel face à une réclamation.", correct: true },
      { text: "Non, reconnaître un manquement engage sa responsabilité civile — elle aurait dû d'abord consulter un avocat.", correct: false },
      { text: "Non, la réclamation aurait dû être adressée directement à l'agence et non à Hélène personnellement.", correct: false },
      { text: "Oui, mais seulement parce que la réclamation est intervenue dans le délai légal de garantie.", correct: false }
    ],
    feedbackOk: "Parfait. La réaction d'Hélène illustre exactement ce que l'article 11 attend : répondre dans un délai raisonnable, de bonne foi, avec professionnalisme, et chercher une solution amiable. Assumer un manquement et proposer une issue constructive renforce la confiance et préserve l'image de la profession.",
    feedbackKo: "L'article 11 valorise précisément ce qu'a fait Hélène : répondre rapidement, reconnaître la difficulté de bonne foi et proposer une solution. La crainte d'engagement de responsabilité ne justifie pas l'évitement — au contraire, une réponse professionnelle et honnête est la meilleure protection à long terme."
  }
];


let current = 0, score = 0, answered = false;

function buildProgress() {
  const row = document.getElementById('progress-row');
  row.innerHTML = '';
  scenarios.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < current ? ' done' : i === current ? ' active' : '');
    row.appendChild(d);
  });
}

function renderScene() {
  const s = scenarios[current];
  document.getElementById('scene-card').innerHTML = `
    <span class="scenario-badge">${s.badge}</span>
    <div class="avatar-row">
      <div class="avatar ${s.avatarClass}">${s.avatarInitials}</div>
      <div>
        <div class="avatar-name">${s.avatarName}</div>
        <div class="avatar-desc">${s.avatarDesc}</div>
      </div>
    </div>
    <p class="scene-text">${s.scene}</p>
  `;
  document.getElementById('q-text').textContent = s.question;
  document.getElementById('q-counter').textContent = `Question ${current + 1} / ${scenarios.length}`;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  s.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => answer(i);
    choicesEl.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('next-btn').className = 'next-btn';
  answered = false;
  buildProgress();
  updateNextBtn();
}

function answer(idx) {
  if (answered) return;
  answered = true;
  const s = scenarios[current];
  const btns = document.querySelectorAll('.choice-btn');
  const isCorrect = s.choices[idx].correct;
  if (isCorrect) score++;

  btns.forEach((btn, i) => {
    if (s.choices[i].correct) btn.classList.add('correct');
    else btn.disabled = true;
  });
  if (!isCorrect) btns[idx].classList.add('wrong');

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show' + (isCorrect ? '' : ' wrong-fb');
  fb.innerHTML = (isCorrect
    ? '<strong>✓ Bonne réponse.</strong> '
    : '<strong>✗ Pas cette fois.</strong> ')
    + (isCorrect ? s.feedbackOk : s.feedbackKo)
    + `<div class="ref">Référence : Code de déontologie des professions immobilières — article 11 (règlement des litiges : solution amiable, réponse de bonne foi aux réclamations, délai raisonnable)</div>`;

  document.getElementById('next-btn').className = 'next-btn show';
}

document.getElementById('next-btn').onclick = () => {
  current++;
  if (current < scenarios.length) {
    renderScene();
  } else {
    showScore();
  }
};

function updateNextBtn() {
  const btn = document.getElementById('next-btn');
  btn.textContent = current === scenarios.length - 1 ? 'Voir mes résultats →' : 'Scénario suivant →';
}

function showScore() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('progress-row').style.display = 'none';
  const sc = document.getElementById('score-card');
  sc.className = 'score-card show';
  document.getElementById('score-val').textContent = score + ' / ' + scenarios.length;
  const msgs = [
    "Reprenez les obligations de l'article 11 : privilégier le dialogue, répondre aux réclamations de bonne foi et dans un délai raisonnable.",
    "Une notion à retravailler. Relisez le scénario que vous avez manqué.",
    "Bien ! Deux situations bien maîtrisées sur trois.",
    "Excellent ! Vous maîtrisez parfaitement les obligations de règlement des litiges de l'article 11."
  ];
  document.getElementById('score-msg').textContent = msgs[Math.min(score, 3)];
}

function restart() {
  current = 0; score = 0; answered = false;
  document.getElementById('quiz-area').style.display = '';
  document.getElementById('progress-row').style.display = '';
  document.getElementById('score-card').className = 'score-card';
  renderScene();
}

renderScene();
</script>
</body>
</html>
