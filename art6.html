<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cas pratique – Code de déontologie immobilier</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #f5f4f0;
  color: #1a1a18;
  min-height: 100vh;
  padding: 2rem 1rem;
}
.wrap { max-width: 680px; margin: 0 auto; }
h1 {
  font-size: 20px;
  font-weight: 500;
  color: #01438F;
  margin-bottom: 0.25rem;
}
.subtitle {
  font-size: 14px;
  color: #666;
  margin-bottom: 1.5rem;
}
.progress-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
.progress-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #d0cec8;
  transition: background 0.2s;
}
.progress-dot.done { background: #52AE32; }
.progress-dot.active { background: #01438F; }
.scenario-card {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
}
.scenario-badge {
  display: inline-block;
  background: #EAF3DE;
  color: #27500A;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 1rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.avatar-row { display: flex; gap: 12px; align-items: center; margin-bottom: 1rem; }
.avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  flex-shrink: 0;
}
.avatar.agent { background: #EAF3DE; color: #27500A; }
.avatar.client { background: #E6F1FB; color: #0C447C; }
.avatar.syndicat { background: #EEEDFE; color: #3C3489; }
.avatar.marchand { background: #FAEEDA; color: #633806; }
.avatar-name { font-size: 14px; font-weight: 600; color: #1a1a18; }
.avatar-desc { font-size: 12px; color: #888; }
.scene-text { font-size: 15px; line-height: 1.7; color: #2c2c2a; }
.question-section { margin-bottom: 1.25rem; }
.question-label {
  font-size: 11px; font-weight: 600; color: #888;
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 0.75rem;
}
.question-text {
  font-size: 15px; font-weight: 600; color: #1a1a18;
  line-height: 1.6; margin-bottom: 1rem;
}
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.85rem 1rem;
  font-size: 14px;
  color: #1a1a18;
  text-align: left;
  cursor: pointer;
  line-height: 1.55;
  transition: background 0.12s, border-color 0.12s;
}
.choice-btn:hover { background: #f5f4f0; border-color: #a0a099; }
.choice-btn.correct { background: #EAF3DE; border-color: #52AE32; color: #173404; }
.choice-btn.wrong { background: #FCEBEB; border-color: #E24B4A; color: #501313; }
.choice-btn:disabled { pointer-events: none; opacity: 0.5; }
.feedback {
  display: none;
  border-left: 3px solid #52AE32;
  background: #f5f4f0;
  border-radius: 0 8px 8px 0;
  padding: 1rem 1.1rem;
  margin-top: 1rem;
  font-size: 14px;
  line-height: 1.65;
  color: #2c2c2a;
}
.feedback.show { display: block; }
.feedback.wrong-fb { border-left-color: #E24B4A; }
.feedback strong { font-weight: 600; }
.ref {
  font-size: 12px; color: #888;
  margin-top: 0.5rem; font-style: italic;
}
.nav-row {
  display: flex; justify-content: space-between;
  align-items: center; margin-top: 1.25rem;
}
.q-counter { font-size: 13px; color: #888; }
.next-btn {
  display: none;
  background: #01438F;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 0.6rem 1.25rem;
  font-size: 14px;
  cursor: pointer;
  font-weight: 500;
}
.next-btn.show { display: block; }
.next-btn:hover { background: #143466; }
.score-card {
  display: none;
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 2.5rem 2rem;
  text-align: center;
}
.score-card.show { display: block; }
.score-big { font-size: 56px; font-weight: 700; color: #01438F; margin: 0.5rem 0; }
.score-sub { font-size: 15px; color: #555; margin-bottom: 1.75rem; line-height: 1.6; }
.restart-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.65rem 1.5rem;
  font-size: 14px;
  color: #1a1a18;
  cursor: pointer;
  font-weight: 500;
}
.restart-btn:hover { background: #f5f4f0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Code de déontologie — Article 6 : la transparence</h1>
  <p class="subtitle">3 scénarios pour identifier les manquements à l'obligation de transparence envers les clients et les tiers</p>

  <div class="progress-row" id="progress-row"></div>

  <div id="quiz-area">
    <div class="scenario-card" id="scene-card"></div>
    <div class="scenario-card" id="question-card">
      <div class="question-section">
        <div class="question-label">À vous de jouer</div>
        <div class="question-text" id="q-text"></div>
        <div class="choices" id="choices"></div>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="nav-row">
        <span class="q-counter" id="q-counter"></span>
        <button class="next-btn" id="next-btn">Scénario suivant →</button>
      </div>
    </div>
  </div>

  <div class="score-card" id="score-card">
    <div class="question-label">Votre résultat</div>
    <div class="score-big" id="score-val">0/4</div>
    <div class="score-sub" id="score-msg"></div>
    <button class="restart-btn" onclick="restart()">↺ Recommencer</button>
  </div>
</div>

<script>
const scenarios = [
  {
    badge: "Scénario 1 — Présentation de la délégation de carte T",
    avatarClass: "agent",
    avatarInitials: "MD",
    avatarName: "Mathieu Darcel",
    avatarDesc: "Conseiller immobilier indépendant, réseau national",
    scene: "Mathieu est en rendez-vous de prise de mandat chez un vendeur. Le client, prudent, lui demande de justifier qu'il est bien autorisé à exercer. Mathieu répond qu'il « fait partie d'un grand réseau » et montre son badge commercial. Il n'a pas son attestation d'habilitation sur lui et dit que « ça ne change rien, c'est le réseau qui a la carte ».",
    question: "Mathieu respecte-t-il ses obligations au titre de l'article 6 du code de déontologie ?",
    choices: [
      { text: "Oui, appartenir à un réseau titulaire de la carte T suffit à justifier son droit à exercer.", correct: false },
      { text: "Oui, un badge professionnel est un justificatif suffisant pour un client.", correct: false },
      { text: "Non, tout collaborateur doit être en mesure de présenter son attestation d'habilitation à la demande d'un client, en rendez-vous comme en toute circonstance.", correct: true },
      { text: "Non, mais seulement si le client refuse de signer le mandat à cause de ce manque.", correct: false }
    ],
    feedbackOk: "Exact. L'article 6 impose à tout collaborateur d'être en mesure de présenter son attestation d'habilitation à la demande de tout client ou personne intéressée — y compris en rendez-vous. Le badge commercial et l'appartenance à un réseau ne remplacent pas ce document. Mathieu aurait dû l'avoir avec lui.",
    feedbackKo: "L'appartenance à un réseau ne suffit pas. L'article 6 est clair : chaque collaborateur doit pouvoir présenter son attestation d'habilitation à toute demande, quel que soit le contexte. C'est ce document — et non un badge — qui justifie son droit à intervenir au nom du titulaire de la carte T."
  },
  {
    badge: "Scénario 2 — Barème des honoraires",
    avatarClass: "client",
    avatarInitials: "TN",
    avatarName: "Théo Nguyen",
    avatarDesc: "Mandataire indépendant, réseau national",
    scene: "En rendez-vous vendeur, le client demande à Théo de lui montrer le barème officiel des honoraires du réseau avant de signer quoi que ce soit. Théo botte en touche : « Les honoraires sont négociables, on verra ça ensemble selon votre projet. » Puis il enchaîne directement sur la visite du bien. Le client n'a jamais obtenu le document.",
    question: "Théo respecte-t-il ses obligations au titre de l'article 6 du code de déontologie ?",
    choices: [
      { text: "Oui, proposer une négociation est une forme de transparence sur les honoraires.", correct: false },
      { text: "Oui, le barème n'a pas à être communiqué tant que le mandat n'est pas signé.", correct: false },
      { text: "Non, lorsqu'un client demande à consulter le barème, le professionnel doit le lui communiquer sans détour ni esquive.", correct: true },
      { text: "Non, mais seulement si le client renouvelle sa demande une deuxième fois.", correct: false }
    ],
    feedbackOk: "Exact. Contourner la demande d'un client sur les honoraires est un manquement à la transparence. L'article 6 impose de fournir une information claire, exacte et complète sur les honoraires et leur mode de calcul — y compris en présentant le barème dès que le client le demande, sans esquive.",
    feedbackKo: "Dévier la question n'est pas une réponse. L'article 6 impose une transparence active : lorsqu'un client demande à consulter le barème, le professionnel doit le lui communiquer sans délai ni contournement. Proposer une négociation ne remplace pas l'obligation d'information."
  },
  {
    badge: "Scénario 3 — Avis de valeur vs expertise",
    avatarClass: "syndicat",
    avatarInitials: "PR",
    avatarName: "Pauline Rousseau",
    avatarDesc: "Agent immobilier, estimations et transactions",
    scene: "Un propriétaire demande à Pauline une estimation de son bien pour une procédure de divorce. Elle lui remet un document intitulé « Expertise immobilière » avec une valeur chiffrée et son logo professionnel. Elle pense que le terme « expertise » est plus valorisant et renforce la crédibilité de son travail.",
    question: "Pauline a-t-elle respecté ses obligations au titre de l'article 6 du code de déontologie ?",
    choices: [
      { text: "Oui, l'avis de valeur et l'expertise immobilière sont deux termes interchangeables en pratique.", correct: false },
      { text: "Oui, elle a fourni un document chiffré et signé — c'est ce que le client attendait.", correct: false },
      { text: "Non, Pauline aurait dû préciser qu'il s'agit d'un avis de valeur et non d'une expertise immobilière, qui répond à des exigences techniques et juridiques strictement différentes.", correct: true },
      { text: "Non, mais seulement si le document est utilisé devant un tribunal.", correct: false }
    ],
    feedbackOk: "Parfait. L'article 6 est explicite : lors d'un avis de valeur, le professionnel doit préciser à son client qu'il ne s'agit pas d'une expertise immobilière. Les deux notions ont des portées juridiques très différentes — notamment dans un contexte de divorce ou de succession. Utiliser le terme « expertise » est trompeur et contraire à la transparence.",
    feedbackKo: "Avis de valeur et expertise immobilière ne sont pas équivalents. L'article 6 impose au professionnel d'informer clairement son client de la nature exacte du document remis. Dans un contexte sensible comme un divorce, cette distinction a des conséquences juridiques réelles — et utiliser le terme « expertise » induit le client en erreur."
  }
];


let current = 0, score = 0, answered = false;

function buildProgress() {
  const row = document.getElementById('progress-row');
  row.innerHTML = '';
  scenarios.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < current ? ' done' : i === current ? ' active' : '');
    row.appendChild(d);
  });
}

function renderScene() {
  const s = scenarios[current];
  document.getElementById('scene-card').innerHTML = `
    <span class="scenario-badge">${s.badge}</span>
    <div class="avatar-row">
      <div class="avatar ${s.avatarClass}">${s.avatarInitials}</div>
      <div>
        <div class="avatar-name">${s.avatarName}</div>
        <div class="avatar-desc">${s.avatarDesc}</div>
      </div>
    </div>
    <p class="scene-text">${s.scene}</p>
  `;
  document.getElementById('q-text').textContent = s.question;
  document.getElementById('q-counter').textContent = `Question ${current + 1} / ${scenarios.length}`;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  s.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => answer(i);
    choicesEl.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('next-btn').className = 'next-btn';
  answered = false;
  buildProgress();
  updateNextBtn();
}

function answer(idx) {
  if (answered) return;
  answered = true;
  const s = scenarios[current];
  const btns = document.querySelectorAll('.choice-btn');
  const isCorrect = s.choices[idx].correct;
  if (isCorrect) score++;

  btns.forEach((btn, i) => {
    if (s.choices[i].correct) btn.classList.add('correct');
    else btn.disabled = true;
  });
  if (!isCorrect) btns[idx].classList.add('wrong');

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show' + (isCorrect ? '' : ' wrong-fb');
  fb.innerHTML = (isCorrect
    ? '<strong>✓ Bonne réponse.</strong> '
    : '<strong>✗ Pas cette fois.</strong> ')
    + (isCorrect ? s.feedbackOk : s.feedbackKo)
    + `<div class="ref">Référence : Code de déontologie des professions immobilières — article 6 (transparence : honoraires, justificatifs d'habilitation, identité des intervenants, assurance, avis de valeur)</div>`;

  document.getElementById('next-btn').className = 'next-btn show';
}

document.getElementById('next-btn').onclick = () => {
  current++;
  if (current < scenarios.length) {
    renderScene();
  } else {
    showScore();
  }
};

function updateNextBtn() {
  const btn = document.getElementById('next-btn');
  btn.textContent = current === scenarios.length - 1 ? 'Voir mes résultats →' : 'Scénario suivant →';
}

function showScore() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('progress-row').style.display = 'none';
  const sc = document.getElementById('score-card');
  sc.className = 'score-card show';
  document.getElementById('score-val').textContent = score + ' / ' + scenarios.length;
  const msgs = [
    "Reprenez les obligations de l'article 6 : information sur les honoraires, justificatifs d'habilitation, distinction avis de valeur / expertise.",
    "Une notion à retravailler. Relisez le scénario que vous avez manqué.",
    "Bien ! Deux situations bien maîtrisées sur trois.",
    "Excellent ! Vous maîtrisez parfaitement les obligations de transparence de l'article 6."
  ];
  document.getElementById('score-msg').textContent = msgs[Math.min(score, 3)];
}

function restart() {
  current = 0; score = 0; answered = false;
  document.getElementById('quiz-area').style.display = '';
  document.getElementById('progress-row').style.display = '';
  document.getElementById('score-card').className = 'score-card';
  renderScene();
}

renderScene();
</script>
</body>
</html>
