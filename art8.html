<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cas pratique – Code de déontologie immobilier</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #f5f4f0;
  color: #1a1a18;
  min-height: 100vh;
  padding: 2rem 1rem;
}
.wrap { max-width: 680px; margin: 0 auto; }
h1 {
  font-size: 20px;
  font-weight: 500;
  color: #01438F;
  margin-bottom: 0.25rem;
}
.subtitle {
  font-size: 14px;
  color: #666;
  margin-bottom: 1.5rem;
}
.progress-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
.progress-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #d0cec8;
  transition: background 0.2s;
}
.progress-dot.done { background: #52AE32; }
.progress-dot.active { background: #01438F; }
.scenario-card {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
}
.scenario-badge {
  display: inline-block;
  background: #EAF3DE;
  color: #27500A;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 1rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.avatar-row { display: flex; gap: 12px; align-items: center; margin-bottom: 1rem; }
.avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  flex-shrink: 0;
}
.avatar.agent { background: #EAF3DE; color: #27500A; }
.avatar.client { background: #E6F1FB; color: #0C447C; }
.avatar.syndicat { background: #EEEDFE; color: #3C3489; }
.avatar.marchand { background: #FAEEDA; color: #633806; }
.avatar-name { font-size: 14px; font-weight: 600; color: #1a1a18; }
.avatar-desc { font-size: 12px; color: #888; }
.scene-text { font-size: 15px; line-height: 1.7; color: #2c2c2a; }
.question-section { margin-bottom: 1.25rem; }
.question-label {
  font-size: 11px; font-weight: 600; color: #888;
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 0.75rem;
}
.question-text {
  font-size: 15px; font-weight: 600; color: #1a1a18;
  line-height: 1.6; margin-bottom: 1rem;
}
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.85rem 1rem;
  font-size: 14px;
  color: #1a1a18;
  text-align: left;
  cursor: pointer;
  line-height: 1.55;
  transition: background 0.12s, border-color 0.12s;
}
.choice-btn:hover { background: #f5f4f0; border-color: #a0a099; }
.choice-btn.correct { background: #EAF3DE; border-color: #52AE32; color: #173404; }
.choice-btn.wrong { background: #FCEBEB; border-color: #E24B4A; color: #501313; }
.choice-btn:disabled { pointer-events: none; opacity: 0.5; }
.feedback {
  display: none;
  border-left: 3px solid #52AE32;
  background: #f5f4f0;
  border-radius: 0 8px 8px 0;
  padding: 1rem 1.1rem;
  margin-top: 1rem;
  font-size: 14px;
  line-height: 1.65;
  color: #2c2c2a;
}
.feedback.show { display: block; }
.feedback.wrong-fb { border-left-color: #E24B4A; }
.feedback strong { font-weight: 600; }
.ref {
  font-size: 12px; color: #888;
  margin-top: 0.5rem; font-style: italic;
}
.nav-row {
  display: flex; justify-content: space-between;
  align-items: center; margin-top: 1.25rem;
}
.q-counter { font-size: 13px; color: #888; }
.next-btn {
  display: none;
  background: #01438F;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 0.6rem 1.25rem;
  font-size: 14px;
  cursor: pointer;
  font-weight: 500;
}
.next-btn.show { display: block; }
.next-btn:hover { background: #143466; }
.score-card {
  display: none;
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 2.5rem 2rem;
  text-align: center;
}
.score-card.show { display: block; }
.score-big { font-size: 56px; font-weight: 700; color: #01438F; margin: 0.5rem 0; }
.score-sub { font-size: 15px; color: #555; margin-bottom: 1.75rem; line-height: 1.6; }
.restart-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.65rem 1.5rem;
  font-size: 14px;
  color: #1a1a18;
  cursor: pointer;
  font-weight: 500;
}
.restart-btn:hover { background: #f5f4f0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Code de déontologie — Article 8 : défense des intérêts en présence</h1>
  <p class="subtitle">3 scénarios pour identifier les manquements au devoir de loyauté, d'information et de suivi envers les parties</p>

  <div class="progress-row" id="progress-row"></div>

  <div id="quiz-area">
    <div class="scenario-card" id="scene-card"></div>
    <div class="scenario-card" id="question-card">
      <div class="question-section">
        <div class="question-label">À vous de jouer</div>
        <div class="question-text" id="q-text"></div>
        <div class="choices" id="choices"></div>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="nav-row">
        <span class="q-counter" id="q-counter"></span>
        <button class="next-btn" id="next-btn">Scénario suivant →</button>
      </div>
    </div>
  </div>

  <div class="score-card" id="score-card">
    <div class="question-label">Votre résultat</div>
    <div class="score-big" id="score-val">0/4</div>
    <div class="score-sub" id="score-msg"></div>
    <button class="restart-btn" onclick="restart()">↺ Recommencer</button>
  </div>
</div>

<script>
const scenarios = [
  {
    badge: "Scénario 1 — Transmission des offres",
    avatarClass: "agent",
    avatarInitials: "BD",
    avatarName: "Baptiste Dumont",
    avatarDesc: "Négociateur immobilier, agence indépendante",
    scene: "Baptiste a reçu deux offres d'achat pour un appartement qu'il a en mandat : une à 285 000 € et une autre à 270 000 €. Il transmet uniquement la première à son vendeur, estimant que la seconde est trop basse et que « ça ne vaut pas la peine de l'embêter avec ça ». Il pense rendre service en faisant le tri.",
    question: "Baptiste respecte-t-il ses obligations au titre de l'article 8 du code de déontologie ?",
    choices: [
      { text: "Oui, transmettre uniquement l'offre la plus favorable protège les intérêts du vendeur.", correct: false },
      { text: "Non, toute proposition conforme au mandat doit être transmise au mandant sans sélection arbitraire ni rétention d'information.", correct: true },
      { text: "Oui, le professionnel peut filtrer les offres pour éviter de parasiter la décision du vendeur.", correct: false },
      { text: "Non, mais seulement si le vendeur avait expressément demandé à recevoir toutes les offres.", correct: false }
    ],
    feedbackOk: "Exact. L'article 8 est clair : toute proposition conforme au mandat doit être transmise au mandant dans les meilleurs délais, sans sélection arbitraire ni rétention d'information. C'est au vendeur — et à lui seul — de décider quelle offre retenir. Baptiste n'avait pas à faire ce choix à sa place.",
    feedbackKo: "Faire le tri entre les offres n'est pas dans les attributions du professionnel. L'article 8 impose de transmettre toutes les propositions conformes au mandat, sans exception ni délai. C'est le mandant qui décide — le professionnel n'est pas là pour filtrer selon sa propre appréciation."
  },
  {
    badge: "Scénario 2 — Information et suivi du dossier",
    avatarClass: "syndicat",
    avatarInitials: "AL",
    avatarName: "Amélie Lorrain",
    avatarDesc: "Négociatrice, transactions résidentielles",
    scene: "Amélie accompagne un acquéreur dans l'achat d'un appartement. Elle apprend que la copropriété fait l'objet d'une procédure judiciaire importante susceptible d'entraîner des travaux coûteux. Elle décide de ne pas en informer son client immédiatement, craignant que cela ne fasse capoter la transaction à laquelle elle a consacré beaucoup de temps.",
    question: "Amélie respecte-t-elle ses obligations au titre de l'article 8 du code de déontologie ?",
    choices: [
      { text: "Oui, tant que la procédure n'est pas définitivement tranchée, elle n'a pas à en informer l'acquéreur.", correct: false },
      { text: "Oui, c'est au notaire de vérifier la situation juridique de la copropriété.", correct: false },
      { text: "Non, mais seulement si l'acquéreur lui pose la question directement.", correct: false },
      { text: "Non, le professionnel doit communiquer toutes les informations utiles dont il dispose et alerter rapidement son client en cas d'événement susceptible d'impacter l'opération.", correct: true }
    ],
    feedbackOk: "Bien joué. L'article 8 impose au professionnel de communiquer toutes les informations utiles dont il dispose et d'alerter son client rapidement en cas de difficulté ou d'événement pouvant affecter l'opération. Une procédure judiciaire sur la copropriété est précisément ce type d'information — Amélie aurait dû en informer son acquéreur sans attendre.",
    feedbackKo: "Le rôle du notaire ne dispense pas le professionnel de son propre devoir d'information. L'article 8 lui impose d'alerter son client dès qu'il a connaissance d'un élément susceptible d'avoir un impact sur l'opération — quelle que soit l'incertitude sur l'issue finale. Retenir cette information pour « sauver » la transaction est un manquement grave."
  },
  {
    badge: "Scénario 3 — Restitution des fonds et documents",
    avatarClass: "marchand",
    avatarInitials: "GV",
    avatarName: "Guillaume Vernet",
    avatarDesc: "Agent immobilier, gestion de transactions",
    scene: "Une vente tombe à l'eau après la rétractation de l'acquéreur. Le vendeur décide de ne pas remettre le bien en vente et informe Guillaume qu'il abandonne son projet pour se concentrer sur d'autres engagements. Guillaume conserve malgré tout les documents originaux — diagnostics, titre de propriété — pendant plusieurs semaines, sans initiative de sa part. Le vendeur doit le relancer à plusieurs reprises pour les récupérer.",
    question: "Guillaume manque-t-il à ses obligations au titre de l'article 8 du code de déontologie ?",
    choices: [
      { text: "Non, conserver les documents quelques semaines reste raisonnable en cas de reprise éventuelle du projet.", correct: false },
      { text: "Oui, dès lors que le vendeur met fin à la mission et ne souhaite pas remettre le bien en vente, les documents doivent être restitués dans un délai raisonnable et sans que le client ait à les réclamer.", correct: true },
      { text: "Non, la restitution n'est obligatoire que si le client en fait la demande formelle par écrit.", correct: false },
      { text: "Oui, mais seulement s'il s'agit de documents originaux et non de copies.", correct: false }
    ],
    feedbackOk: "Parfait. Dès lors que le vendeur met fin à la mission et ne souhaite pas poursuivre le projet, la raison de conserver les documents disparaît. L'article 8 impose de les restituer dans un délai raisonnable — sans attendre plusieurs relances. C'est une obligation, pas un geste de courtoisie.",
    feedbackKo: "Lorsque la mission prend fin à l'initiative du mandant et que celui-ci ne souhaite pas remettre son bien en vente, il n'existe plus aucun motif légitime de conserver ses documents. L'article 8 impose leur restitution rapide. Guillaume aurait dû les rendre dès que le vendeur a confirmé l'abandon de son projet."
  }
];


let current = 0, score = 0, answered = false;

function buildProgress() {
  const row = document.getElementById('progress-row');
  row.innerHTML = '';
  scenarios.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < current ? ' done' : i === current ? ' active' : '');
    row.appendChild(d);
  });
}

function renderScene() {
  const s = scenarios[current];
  document.getElementById('scene-card').innerHTML = `
    <span class="scenario-badge">${s.badge}</span>
    <div class="avatar-row">
      <div class="avatar ${s.avatarClass}">${s.avatarInitials}</div>
      <div>
        <div class="avatar-name">${s.avatarName}</div>
        <div class="avatar-desc">${s.avatarDesc}</div>
      </div>
    </div>
    <p class="scene-text">${s.scene}</p>
  `;
  document.getElementById('q-text').textContent = s.question;
  document.getElementById('q-counter').textContent = `Question ${current + 1} / ${scenarios.length}`;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  s.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => answer(i);
    choicesEl.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('next-btn').className = 'next-btn';
  answered = false;
  buildProgress();
  updateNextBtn();
}

function answer(idx) {
  if (answered) return;
  answered = true;
  const s = scenarios[current];
  const btns = document.querySelectorAll('.choice-btn');
  const isCorrect = s.choices[idx].correct;
  if (isCorrect) score++;

  btns.forEach((btn, i) => {
    if (s.choices[i].correct) btn.classList.add('correct');
    else btn.disabled = true;
  });
  if (!isCorrect) btns[idx].classList.add('wrong');

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show' + (isCorrect ? '' : ' wrong-fb');
  fb.innerHTML = (isCorrect
    ? '<strong>✓ Bonne réponse.</strong> '
    : '<strong>✗ Pas cette fois.</strong> ')
    + (isCorrect ? s.feedbackOk : s.feedbackKo)
    + `<div class="ref">Référence : Code de déontologie des professions immobilières — article 8 (défense des intérêts en présence : transmission des offres, information des parties, suivi de mission, restitution des documents)</div>`;

  document.getElementById('next-btn').className = 'next-btn show';
}

document.getElementById('next-btn').onclick = () => {
  current++;
  if (current < scenarios.length) {
    renderScene();
  } else {
    showScore();
  }
};

function updateNextBtn() {
  const btn = document.getElementById('next-btn');
  btn.textContent = current === scenarios.length - 1 ? 'Voir mes résultats →' : 'Scénario suivant →';
}

function showScore() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('progress-row').style.display = 'none';
  const sc = document.getElementById('score-card');
  sc.className = 'score-card show';
  document.getElementById('score-val').textContent = score + ' / ' + scenarios.length;
  const msgs = [
    "Reprenez les obligations de l'article 8 : transmission des offres, information et suivi du client, restitution des documents en fin de mission.",
    "Une notion à retravailler. Relisez le scénario que vous avez manqué.",
    "Bien ! Deux situations bien maîtrisées sur trois.",
    "Excellent ! Vous maîtrisez parfaitement les obligations de défense des intérêts de l'article 8."
  ];
  document.getElementById('score-msg').textContent = msgs[Math.min(score, 3)];
}

function restart() {
  current = 0; score = 0; answered = false;
  document.getElementById('quiz-area').style.display = '';
  document.getElementById('progress-row').style.display = '';
  document.getElementById('score-card').className = 'score-card';
  renderScene();
}

renderScene();
</script>
</body>
</html>
