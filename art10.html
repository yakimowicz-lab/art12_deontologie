<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cas pratique – Code de déontologie immobilier</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #f5f4f0;
  color: #1a1a18;
  min-height: 100vh;
  padding: 2rem 1rem;
}
.wrap { max-width: 680px; margin: 0 auto; }
h1 {
  font-size: 20px;
  font-weight: 500;
  color: #01438F;
  margin-bottom: 0.25rem;
}
.subtitle {
  font-size: 14px;
  color: #666;
  margin-bottom: 1.5rem;
}
.progress-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
.progress-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #d0cec8;
  transition: background 0.2s;
}
.progress-dot.done { background: #52AE32; }
.progress-dot.active { background: #01438F; }
.scenario-card {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
}
.scenario-badge {
  display: inline-block;
  background: #EAF3DE;
  color: #27500A;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 1rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.avatar-row { display: flex; gap: 12px; align-items: center; margin-bottom: 1rem; }
.avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  flex-shrink: 0;
}
.avatar.agent { background: #EAF3DE; color: #27500A; }
.avatar.client { background: #E6F1FB; color: #0C447C; }
.avatar.syndicat { background: #EEEDFE; color: #3C3489; }
.avatar.marchand { background: #FAEEDA; color: #633806; }
.avatar-name { font-size: 14px; font-weight: 600; color: #1a1a18; }
.avatar-desc { font-size: 12px; color: #888; }
.scene-text { font-size: 15px; line-height: 1.7; color: #2c2c2a; }
.question-section { margin-bottom: 1.25rem; }
.question-label {
  font-size: 11px; font-weight: 600; color: #888;
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 0.75rem;
}
.question-text {
  font-size: 15px; font-weight: 600; color: #1a1a18;
  line-height: 1.6; margin-bottom: 1rem;
}
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.85rem 1rem;
  font-size: 14px;
  color: #1a1a18;
  text-align: left;
  cursor: pointer;
  line-height: 1.55;
  transition: background 0.12s, border-color 0.12s;
}
.choice-btn:hover { background: #f5f4f0; border-color: #a0a099; }
.choice-btn.correct { background: #EAF3DE; border-color: #52AE32; color: #173404; }
.choice-btn.wrong { background: #FCEBEB; border-color: #E24B4A; color: #501313; }
.choice-btn:disabled { pointer-events: none; opacity: 0.5; }
.feedback {
  display: none;
  border-left: 3px solid #52AE32;
  background: #f5f4f0;
  border-radius: 0 8px 8px 0;
  padding: 1rem 1.1rem;
  margin-top: 1rem;
  font-size: 14px;
  line-height: 1.65;
  color: #2c2c2a;
}
.feedback.show { display: block; }
.feedback.wrong-fb { border-left-color: #E24B4A; }
.feedback strong { font-weight: 600; }
.ref {
  font-size: 12px; color: #888;
  margin-top: 0.5rem; font-style: italic;
}
.nav-row {
  display: flex; justify-content: space-between;
  align-items: center; margin-top: 1.25rem;
}
.q-counter { font-size: 13px; color: #888; }
.next-btn {
  display: none;
  background: #01438F;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 0.6rem 1.25rem;
  font-size: 14px;
  cursor: pointer;
  font-weight: 500;
}
.next-btn.show { display: block; }
.next-btn:hover { background: #143466; }
.score-card {
  display: none;
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0ddd6;
  padding: 2.5rem 2rem;
  text-align: center;
}
.score-card.show { display: block; }
.score-big { font-size: 56px; font-weight: 700; color: #01438F; margin: 0.5rem 0; }
.score-sub { font-size: 15px; color: #555; margin-bottom: 1.75rem; line-height: 1.6; }
.restart-btn {
  background: #fff;
  border: 1px solid #d0cec8;
  border-radius: 8px;
  padding: 0.65rem 1.5rem;
  font-size: 14px;
  color: #1a1a18;
  cursor: pointer;
  font-weight: 500;
}
.restart-btn:hover { background: #f5f4f0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Code de déontologie — Article 10 : la confraternité</h1>
  <p class="subtitle">3 scénarios pour identifier les manquements au devoir de loyauté, de respect et de fair-play entre professionnels</p>

  <div class="progress-row" id="progress-row"></div>

  <div id="quiz-area">
    <div class="scenario-card" id="scene-card"></div>
    <div class="scenario-card" id="question-card">
      <div class="question-section">
        <div class="question-label">À vous de jouer</div>
        <div class="question-text" id="q-text"></div>
        <div class="choices" id="choices"></div>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="nav-row">
        <span class="q-counter" id="q-counter"></span>
        <button class="next-btn" id="next-btn">Scénario suivant →</button>
      </div>
    </div>
  </div>

  <div class="score-card" id="score-card">
    <div class="question-label">Votre résultat</div>
    <div class="score-big" id="score-val">0/4</div>
    <div class="score-sub" id="score-msg"></div>
    <button class="restart-btn" onclick="restart()">↺ Recommencer</button>
  </div>
</div>

<script>
const scenarios = [
  {
    badge: "Scénario 1 — Dénigrement d'un confrère",
    avatarClass: "agent",
    avatarInitials: "CL",
    avatarName: "Cédric Lautier",
    avatarDesc: "Agent immobilier, agence indépendante",
    scene: "Cédric est en rendez-vous de prise de mandat chez un vendeur qui lui indique avoir également contacté une agence concurrente. Pour se démarquer, Cédric explique au vendeur que cette agence a mauvaise réputation dans le quartier, qu'elle « survend les biens pour prendre des mandats » et qu'il vaut mieux éviter de travailler avec elle. Il n'a aucune preuve de ces affirmations.",
    question: "Cédric respecte-t-il ses obligations au titre de l'article 10 du code de déontologie ?",
    choices: [
      { text: "Oui, informer un client des pratiques douteuses d'un concurrent fait partie du conseil professionnel.", correct: false },
      { text: "Non, les professionnels doivent s'abstenir de tout propos susceptible de dénigrer ou de discréditer un confrère, a fortiori sans preuve.", correct: true },
      { text: "Oui, la liberté d'expression permet de donner un avis sur les pratiques d'autres agences.", correct: false },
      { text: "Non, mais seulement si le vendeur signe finalement avec l'agence concurrente.", correct: false }
    ],
    feedbackOk: "Exact. L'article 10 interdit tout comportement ou propos susceptible de dénigrer, discréditer ou porter atteinte à la réputation d'un confrère. Cédric n'a pas formulé un avis objectif et prudent — il a tenu des propos non fondés dans un but commercial. C'est un manquement caractérisé à la confraternité.",
    feedbackKo: "La liberté d'expression ne s'applique pas sans limite dans le cadre professionnel. L'article 10 interdit explicitement les propos susceptibles de dénigrer un confrère. Et lorsqu'un professionnel est amené à donner un avis sur les pratiques d'un autre, il doit être officiellement sollicité pour cela et formuler cet avis avec prudence et objectivité — ce qui n'est pas le cas ici."
  },
  {
    badge: "Scénario 2 — Démarcharge déloyal",
    avatarClass: "marchand",
    avatarInitials: "MK",
    avatarName: "Manon Klein",
    avatarDesc: "Négociatrice, réseau national",
    scene: "Manon sait qu'un vendeur a signé un mandat exclusif avec une agence concurrente. Elle contacte directement ce vendeur et lui dit que l'agence en question est connue pour « ne pas diffuser correctement les annonces » et lui propose de signer un nouveau mandat avec elle dès que l'exclusivité sera terminée. Elle lui glisse également que l'autre agence « a sûrement surestimé votre bien pour avoir le mandat ».",
    question: "Le comportement de Manon est-il conforme à l'article 10 du code de déontologie ?",
    choices: [
      { text: "Oui, contacter un vendeur dont le mandat exclusif est en cours est permis tant qu'elle ne lui demande pas de rompre le contrat.", correct: false },
      { text: "Oui, proposer ses services après la fin d'un mandat est une démarche commerciale normale.", correct: false },
      { text: "Non, mais uniquement parce qu'elle contacte le vendeur pendant la période d'exclusivité.", correct: false },
      { text: "Non, Manon dénigre un confrère et tente de détourner un client de sa relation commerciale en utilisant des informations trompeuses.", correct: true }
    ],
    feedbackOk: "Bien vu. Manon cumule deux manquements à l'article 10 : elle dénigre un confrère sans fondement, et elle cherche à détourner un client de sa relation commerciale en transmettant des informations trompeuses. Ces deux comportements sont explicitement interdits par le code de déontologie.",
    feedbackKo: "Le problème ne se limite pas à la période d'exclusivité. Manon dénigre activement un confrère et utilise des informations non vérifiées pour détourner un client — deux manquements distincts à l'article 10. Une approche confraternelle aurait consisté à attendre la fin du mandat sans commentaire sur l'agence concurrente."
  },
  {
    badge: "Scénario 3 — Confrère en infraction",
    avatarClass: "syndicat",
    avatarInitials: "PD",
    avatarName: "Pierre Delacroix",
    avatarDesc: "Agent immobilier, membre d'un syndicat professionnel",
    scene: "Pierre constate qu'un confrère de sa ville semble pratiquer des honoraires non affichés et ne présente jamais sa carte professionnelle à ses clients. Lors d'une visite commune avec un acquéreur, Pierre profite de l'occasion pour signaler ces irrégularités directement au client, en commentant : « Vous devriez vérifier s'il est bien habilité — ce n'est pas très sérieux. »",
    question: "Pierre a-t-il adopté la bonne démarche au titre de l'article 10 du code de déontologie ?",
    choices: [
      { text: "Non, Pierre aurait dû s'abstenir de critiquer son confrère devant le client et privilégier un échange direct avec lui ou un signalement aux instances compétentes.", correct: true },
      { text: "Oui, alerter les clients sur les pratiques non conformes d'un confrère protège les consommateurs.", correct: false },
      { text: "Oui, en tant que membre d'un syndicat professionnel, Pierre a un devoir de signalement auprès des clients.", correct: false },
      { text: "Non, mais seulement s'il n'a pas de preuve formelle des irrégularités constatées.", correct: false }
    ],
    feedbackOk: "Parfait. L'article 10 est clair : si un professionnel constate qu'un confrère ne respecte pas le code, il ne doit pas le critiquer directement auprès des clients. Il doit privilégier un échange avec ce confrère ou, si nécessaire, alerter les instances compétentes. Par ailleurs, son éventuelle fonction syndicale ne lui donne pas de légitimité supplémentaire pour intervenir de cette façon.",
    feedbackKo: "La démarche de Pierre, même animée de bonnes intentions, n'est pas conforme à l'article 10. Critiquer un confrère devant un client — même pour des manquements réels — est interdit. Le code prévoit une voie professionnelle : échanger directement avec le confrère ou alerter les instances compétentes, pas décrédibiliser publiquement un pair."
  }
];


let current = 0, score = 0, answered = false;

function buildProgress() {
  const row = document.getElementById('progress-row');
  row.innerHTML = '';
  scenarios.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < current ? ' done' : i === current ? ' active' : '');
    row.appendChild(d);
  });
}

function renderScene() {
  const s = scenarios[current];
  document.getElementById('scene-card').innerHTML = `
    <span class="scenario-badge">${s.badge}</span>
    <div class="avatar-row">
      <div class="avatar ${s.avatarClass}">${s.avatarInitials}</div>
      <div>
        <div class="avatar-name">${s.avatarName}</div>
        <div class="avatar-desc">${s.avatarDesc}</div>
      </div>
    </div>
    <p class="scene-text">${s.scene}</p>
  `;
  document.getElementById('q-text').textContent = s.question;
  document.getElementById('q-counter').textContent = `Question ${current + 1} / ${scenarios.length}`;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  s.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => answer(i);
    choicesEl.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('next-btn').className = 'next-btn';
  answered = false;
  buildProgress();
  updateNextBtn();
}

function answer(idx) {
  if (answered) return;
  answered = true;
  const s = scenarios[current];
  const btns = document.querySelectorAll('.choice-btn');
  const isCorrect = s.choices[idx].correct;
  if (isCorrect) score++;

  btns.forEach((btn, i) => {
    if (s.choices[i].correct) btn.classList.add('correct');
    else btn.disabled = true;
  });
  if (!isCorrect) btns[idx].classList.add('wrong');

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show' + (isCorrect ? '' : ' wrong-fb');
  fb.innerHTML = (isCorrect
    ? '<strong>✓ Bonne réponse.</strong> '
    : '<strong>✗ Pas cette fois.</strong> ')
    + (isCorrect ? s.feedbackOk : s.feedbackKo)
    + `<div class="ref">Référence : Code de déontologie des professions immobilières — article 10 (confraternité : interdiction de dénigrement, loyauté dans la concurrence, signalement aux instances compétentes)</div>`;

  document.getElementById('next-btn').className = 'next-btn show';
}

document.getElementById('next-btn').onclick = () => {
  current++;
  if (current < scenarios.length) {
    renderScene();
  } else {
    showScore();
  }
};

function updateNextBtn() {
  const btn = document.getElementById('next-btn');
  btn.textContent = current === scenarios.length - 1 ? 'Voir mes résultats →' : 'Scénario suivant →';
}

function showScore() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('progress-row').style.display = 'none';
  const sc = document.getElementById('score-card');
  sc.className = 'score-card show';
  document.getElementById('score-val').textContent = score + ' / ' + scenarios.length;
  const msgs = [
    "Reprenez les obligations de l'article 10 : interdiction de dénigrer un confrère, loyauté dans la concurrence, signalement aux instances compétentes.",
    "Une notion à retravailler. Relisez le scénario que vous avez manqué.",
    "Bien ! Deux situations bien maîtrisées sur trois.",
    "Excellent ! Vous maîtrisez parfaitement les obligations de confraternité de l'article 10."
  ];
  document.getElementById('score-msg').textContent = msgs[Math.min(score, 3)];
}

function restart() {
  current = 0; score = 0; answered = false;
  document.getElementById('quiz-area').style.display = '';
  document.getElementById('progress-row').style.display = '';
  document.getElementById('score-card').className = 'score-card';
  renderScene();
}

renderScene();
</script>
</body>
</html>
